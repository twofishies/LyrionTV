  let ignorePop = 0;
  function root(name, params) {
    const extra = S.nav.length - 1;
    for (const e of S.nav) dispose(e);
    if (!params && VIEWS[name]) { store.set('view', name); if (name !== 'now' && name !== 'queue') store.set('browseView', name); }
    S.nav = [{ name, params }]; S.shown = null;
    show(S.nav[0]);
    // Take the browser history back to the root as well, so Back leaves the app only from there.
    if (extra > 0) { ignorePop++; history.go(-extra); }
  }
  /** Back n views (LMS menus may ask for two). */
  function back(n = 1) {
    n = Math.min(n, S.nav.length - 1);
    if (n > 0) history.go(-n);
  }
  window.addEventListener('popstate', (e) => {
    // Back leaves whatever was open over the page: a menu or dialog belongs to the page left.
    closeSheet();
    document.body.classList.remove('nav-open');
    if (ignorePop) { ignorePop--; history.replaceState(navState(1), ''); return; }
    // Back past LyrionJS's first page, over an LMS skin: the skin again.
    if (document.documentElement.classList.contains('host-own') && !(e.state && e.state.own)) document.documentElement.classList.remove('host-own');
    const d = (e.state && e.state.d) || 1;
    if (d >= S.nav.length) {
      // Forward to a view we have already left: there's nothing to go forward to.
      history.replaceState(navState(S.nav.length), '');
      return;
    }
    while (S.nav.length > d) dispose(S.nav.pop());
    show(S.nav[S.nav.length - 1]);
  });

  /**
   * The controlled player changed: views that show its settings or state start again, those
   * further back too (they are built afresh when Back reaches them).
   */
  function playerChanged() {
    const top = S.shown;
    let rebuild = false;
    for (const e of S.nav) {
      if (e.page && e.page.perPlayer) { if (e === top) rebuild = true; dispose(e); }
    }
    if (rebuild) show(top);
    sidePlayerChanged();
  }
  // ---------------------------------------------------------------------------
  // Polling
  // ---------------------------------------------------------------------------
  const STATUS_TAGS = 'tags:aAlcdejJKNoqrstuyITRx';
  let pollTimer = null, pollCount = 0, polling = false, pollAgain = false;
  let localStatusFor = null;   // the local player's state when S.localStatus was fetched

  /** Poll soon. Only one poll runs at a time; a request made during one runs right after it. */
  function pollSoon(ms = 250) {
    if (polling) { pollAgain = true; return; }
    clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms);
  }

  async function poll() {
    clearTimeout(pollTimer);
    if (!S.lms) return;
    if (polling) { pollAgain = true; return; }
    polling = true;
    try {
      const target = S.target;
      if (target) {
        const st = await rpc(['status', '-', 1, STATUS_TAGS], target);
        if (target === S.target) {   // the player wasn't switched meanwhile
          S.status = st; S.statusAt = performance.now();
          // LMS doesn't change playlist_timestamp when the current track changes (a jump, or the next
          // track starting), so the current index is watched too: the queue marks the current track.
          if (st.playlist_timestamp !== S.lastPlaylistTs || st.playlist_cur_index !== S.lastPlaylistCur) {
            S.lastPlaylistTs = st.playlist_timestamp; S.lastPlaylistCur = st.playlist_cur_index; emitPlaylistChanged();
          }
          updateNowPlaying();
        }
      }
      if (pollCount++ % 5 === 0) await pollPlayers();
      // This browser's own status (the lock screen shows it) while another player is controlled:
      // now and then while it plays, and whenever its state changed (paused, stopped…).
      if (S.local && !isLocal(S.target)) {
        const state = S.local.state;
        if ((state === 'playing' && pollCount % 3 === 0) || state !== localStatusFor) {
          S.localStatus = await S.lms.rpc(S.localId, ['status', '-', 1, STATUS_TAGS]);
          localStatusFor = state;
        }
      } else if (isLocal(S.target)) { S.localStatus = S.status; localStatusFor = null; }
      updateMediaSession();
      setConn(true);
    } catch (e) {
      setConn(false, e.message);
    } finally {
      polling = false;
    }
    const again = pollAgain; pollAgain = false;
    pollTimer = setTimeout(poll, again ? 50 : (document.hidden ? 5000 : 1000));
  }

  /**
   * Which player to control, given LMS's players: the one picked by hand (by default, this
   * browser's), as soon as LMS has it; meanwhile the one controlled, if LMS still has it; else
   * this browser's, or any. null: no change. A stand-in is never remembered, so a page opened
   * before LMS knows this browser's player again goes back to it as soon as it does.
   */
  function pickTarget(ids, current, chosen, localId) {
    const has = (id) => !!id && ids.includes(id);
    const want = has(chosen || localId) ? chosen || localId : has(current) ? current : has(localId) ? localId : ids[0] || null;
    return want && want !== current ? want : null;
  }

  async function pollPlayers() {
    const r = await S.lms.rpc('', ['players', 0, 100]);
    S.players = (r.players_loop || []).filter((p) => +p.connected || isLocal(p.playerid) || p.playerid === S.target || p.playerid === S.chosen);
    const next = pickTarget(S.players.map((p) => p.playerid), S.target, S.chosen, S.localId);
    if (next) setTarget(next, true);
    try { const sg = await S.lms.rpc('', ['syncgroups', '?']); S.syncgroups = sg.syncgroups_loop || []; } catch (e) { S.syncgroups = []; }
    renderPlayerButton();
    updateHost();
  }

  let connLost = false;
  function setConn(ok, msg) {
    const el = document.getElementById('conn');
    // Back after losing it: the server may have restarted with a new version of the page.
    if (ok && connLost) checkUpdate();
    connLost = !ok;
    el.hidden = ok; if (!ok) el.textContent = tr('Lost contact with the server: {error} — retrying…', { error: msg || '' });
  }

  /** Control this player. auto: a stand-in chosen by the page, not remembered as the choice. */
  function setTarget(id, auto) {
    if (!auto) { S.chosen = id; store.set('target', id); }
    const changed = id !== S.target;
    S.target = id; S.status = null; S.lastPlaylistTs = null; S.lastPlaylistCur = null;
    renderPlayerButton(); updateNowPlaying(); pollSoon(10);
    loadPluginMenus();
    if (changed) playerChanged();
  }

  const playlistListeners = new Set();
  function emitPlaylistChanged() { for (const f of playlistListeners) f(); }

  // ---------------------------------------------------------------------------
  // Now playing model
  // ---------------------------------------------------------------------------
  function current(st = S.status) {
    if (!st) return null;
    const t = (st.playlist_loop || [])[0] || {};
    const rm = st.remoteMeta || {};
    const remote = !!(+t.remote || +st.remote);
    const title = t.title || rm.title || st.current_title || '';
    return {
      title, artist: t.artist || t.trackartist || t.albumartist || rm.artist || '', album: t.album || rm.album || '',
      artistId: t.artist_id, albumId: t.album_id, id: t.id, url: t.url, remote,
      stationTitle: remote && st.current_title && st.current_title !== title ? st.current_title : '',
      duration: +st.duration || +t.duration || 0, type: t.type, bitrate: t.bitrate, samplerate: t.samplerate, samplesize: t.samplesize,
      year: t.year, coverid: t.coverid, artwork: t.artwork_url,
    };
  }
  function elapsedNow() {
    const st = S.status; if (!st) return 0;
    let t = +st.time || 0;
    if (st.mode === 'play') t += (performance.now() - S.statusAt) / 1000 * (+st.rate || 1);
    const d = +st.duration || 0;
    return d ? Math.min(t, d) : t;
  }
  function nowArt(size) {
    const st = S.status; if (!st || !S.target) return null;
    const c = current(st);
    if (c && c.artwork && !/^\/?music\/current/.test(c.artwork)) { const u = S.lms.art(c.artwork, size); if (u) return u; }
    if (c && c.coverid) return S.lms.cover(c.coverid, size);
    return S.lms.url(`music/current/cover_${size}x${size}_f?player=${encodeURIComponent(S.target)}&t=${encodeURIComponent(st.playlist_timestamp || '')}`);
  }
  function qualityLabel(c) {
    if (!c) return '';
    const parts = [];
    if (c.type) parts.push(String(c.type).toUpperCase());
    if (c.samplesize && c.samplerate) parts.push(`${c.samplesize}/${(c.samplerate / 1000).toFixed(c.samplerate % 1000 ? 1 : 0)}`);
    else if (c.bitrate) parts.push(String(c.bitrate).replace(/\s*kbps.*/i, ' kb/s'));
    return parts.join(' · ');
  }
  // ---------------------------------------------------------------------------
  // Actions on library items
  // ---------------------------------------------------------------------------
  const QUAL = { artist: 'artist_id', album: 'album_id', track: 'track_id', genre: 'genre_id', playlist: 'playlist_id', folder: 'folder_id', year: 'year' };

  function pc(cmd, kind, id, extra = []) {
    const q = `${QUAL[kind]}:${id}`;
    const msgs = { load: tr('Playing'), insert: tr('Playing next'), add: tr('Added to the queue') };
    return act(['playlistcontrol', 'cmd:' + cmd, q, ...extra], msgs[cmd]);
  }
  async function playShuffled(kind, id) {
    try { await rpc(['playlist', 'shuffle', 1]); await rpc(['playlistcontrol', 'cmd:load', `${QUAL[kind]}:${id}`]); toast(tr('Playing shuffled')); pollSoon(); }
    catch (e) { fail(e); }
  }
  /** Plays an item now without clearing the queue: inserted after the current track, then jumped to. */
  async function playKeep(kind, id) {
    try {
      const st = await rpc(['status', '-', 1]);
      const at = +st.playlist_tracks ? (+st.playlist_cur_index || 0) + 1 : 0;
      await rpc(['playlistcontrol', 'cmd:insert', `${QUAL[kind]}:${id}`]);
      await rpc(['playlist', 'index', at]); toast(tr('Playing')); pollSoon();
    } catch (e) { fail(e); }
  }

  // What tapping a track in a library list does (Settings, "Tapping a track"): play it now, replacing
  // the queue (the list's own play, which may queue the whole album); play it now, keeping the queue;
  // or open a row of the chosen actions under it. The ids are libMenu's icons, plus 'keep' and 'all'.
  const TAP_DEFAULT = ['next_up', 'add'];
  const tapItems = () => [['play', tr('Play now')], ['keep', tr('Play now, keep the queue')], ['next_up', tr('Play next')], ['add', tr('Add to queue')],
    ['artist', tr('Go to artist')], ['album', tr('Go to album')], ['playlist', tr('Add to playlist…')], ['fav', tr('Add to favourites')],
    ['more', tr('More…')], ['all', tr('All options…')]];

  function tapTrack(it, play, extra = []) {
    return (e) => {
      const mode = store.get('tapAction', 'play');
      if (mode === 'keep') return playKeep('track', it.id);
      if (mode !== 'menu') return play();
      trackActions(e.currentTarget, it, play, extra);
    };
  }

  function trackActions(r, it, play, extra) {
    const wasOpen = r.getAttribute('aria-expanded') === 'true';
    closeTrackActions();
    if (wasOpen) return;
    const show = store.get('tapItems', TAP_DEFAULT);
    libMenu('track', it, [], (name, items) => {
      const by = Object.fromEntries(items.map((x) => [x.icon, x]));
      Object.assign(by, { play: { icon: 'play', run: play }, keep: { icon: 'play', run: () => playKeep('track', it.id) }, all: { icon: 'menu', run: () => libMenu('track', it, extra) } });
      const btns = tapItems().filter(([k]) => show.includes(k) && by[k]).map(([k, label]) => h('button', { type: 'button', class: 'btn ghost',
        onclick: async () => { closeTrackActions(); try { await by[k].run(); } catch (e) { fail(e); } } }, icon(by[k].icon), label));
      if (!btns.length) return libMenu('track', it, extra);
      r.setAttribute('aria-expanded', 'true');
      r.after(h('div', { class: 'row-actions', role: 'group', 'aria-label': name }, btns));
    });
  }

  function closeTrackActions() {
    for (const x of document.querySelectorAll('.row-actions')) { if (x.previousElementSibling) x.previousElementSibling.setAttribute('aria-expanded', 'false'); x.remove(); }
  }

  function libMenu(kind, it, extra = [], show = sheet) {
    const name = it.title || it.album || it.artist || it.playlist || it.genre || it.year || it.filename || '';
    const items = [
      { label: tr('Play now'), icon: 'play', run: () => pc('load', kind, it.id) },
      { label: tr('Play next'), icon: 'next_up', run: () => pc('insert', kind, it.id) },
      { label: tr('Add to queue'), icon: 'add', run: () => pc('add', kind, it.id) },
    ];
    if (kind !== 'track') items.push({ label: tr('Shuffle'), icon: 'shuffle', run: () => playShuffled(kind, it.id) });
    if (kind === 'track' || kind === 'album') {
      if (it.artist_id) items.push({ label: tr('Go to artist'), icon: 'artist', run: () => push('artist', { id: it.artist_id, name: it.artist }) });
      if (kind === 'track' && it.album_id) items.push({ label: tr('Go to album'), icon: 'album', run: () => push('album', { id: it.album_id, title: it.album, artist: it.artist, artist_id: it.artist_id }) });
    }
    if (kind === 'track' && it.url) items.push({ label: tr('Add to playlist…'), icon: 'playlist', run: () => addToPlaylist([it.url]) });
    if (it.favorites_url || (kind === 'track' && it.url)) items.push({ label: tr('Add to favourites'), icon: 'fav', run: () => act(['favorites', 'add', 'url:' + (it.favorites_url || it.url), 'title:' + (it.favorites_title || name)], tr('Added to favourites'), '') });
    const info = contextMenu(kind, it);
    if (info) items.push({ label: tr('More…'), icon: 'more', run: () => push('jive', { action: info, title: name }) });
    show(name, items.concat(extra), { sub: it.artist && kind !== 'artist' ? it.artist : (kind === 'track' && it.album ? it.album : null), art: it.art });
  }

  async function addToPlaylist(urls) {
    try {
      const r = await rpc(['playlists', 0, 500], '');
      const lists = r.playlists_loop || [];
      sheet(tr('Add to playlist'), [
        { label: tr('New playlist…'), icon: 'add', run: async () => {
          const name = await prompt2(tr('New playlist'), { placeholder: tr('Name'), ok: tr('Create') });
          if (!name) return;
          const nr = await rpc(['playlists', 'new', 'name:' + name], '');
          // LMS doesn't create a second playlist with a name in use: it names the existing one.
          if (!nr.playlist_id && nr.overwritten_playlist_id && !(await confirm2(tr('“{name}” already exists. Add to it?', { name }), tr('Add to it')))) return;
          const id = nr.playlist_id || nr.overwritten_playlist_id;
          for (const u of urls) await rpc(['playlists', 'edit', 'cmd:add', 'playlist_id:' + id, 'url:' + u], '');
          toast(tr('Added to {name}', { name }));
        } },
        { sep: true },
        ...lists.map((p) => ({ label: p.playlist, icon: 'playlist', run: async () => {
          for (const u of urls) await rpc(['playlists', 'edit', 'cmd:add', 'playlist_id:' + p.id, 'url:' + u], '');
          toast(tr('Added to {name}', { name: p.playlist }));
        } })),
      ]);
    } catch (e) { fail(e); }
  }
  // -- Favourites, radio, apps (LMS's XMLBrowser menus) ------------------------
  function xmlArt(it) { return S.lms.art(it.image || it.icon || it.cover, 120); }

  function xmlMenu(cmd, it, extra = []) {
    const items = [];
    if (+it.isaudio) {
      items.push({ label: tr('Play now'), icon: 'play', run: () => act([cmd, 'playlist', 'play', 'item_id:' + it.id], tr('Playing')) });
      items.push({ label: tr('Play next'), icon: 'next_up', run: () => act([cmd, 'playlist', 'insert', 'item_id:' + it.id], tr('Playing next')) });
      items.push({ label: tr('Add to queue'), icon: 'add', run: () => act([cmd, 'playlist', 'add', 'item_id:' + it.id], tr('Added to the queue')) });
    }
    if (cmd !== 'favorites' && it.url && +it.isaudio) items.push({ label: tr('Add to favourites'), icon: 'fav', run: () => act(['favorites', 'add', 'url:' + it.url, 'title:' + it.name, ...(it.image ? ['icon:' + it.image] : [])], tr('Added to favourites'), '') });
    sheet(it.name, items.concat(extra), { art: xmlArt(it) });
  }

  // -- LMS menus (SlimBrowse) --------------------------------------------------
  // LMS describes its menus, and everything plugins add to them, in the format its own
  // controllers use. Rendering that format means AudioMuse-AI, Custom Browse, context menus
  // and any future plugin appear here without special code.
  const STANDARD_MYMUSIC = /^(myMusicArtists|myMusicAlbums|myMusicGenres|myMusicYears|myMusicNewMusic|myMusicMusicFolder|myMusicPlaylists|myMusicSearch|randomplay$|pluginLyrionJS$)/;

  let menusSeq = 0;
  async function loadPluginMenus() {
    const player = S.target || S.localId;
    if (!player) return;
    const my = ++menusSeq;
    try {
      const r = await S.lms.rpc(player, ['menu', 0, 1000, 'direct:1']);
      if (my !== menusSeq) return;   // a newer request (another player) answers instead
      S.pluginMenus = (r.item_loop || [])
        .filter((i) => (i.node === 'myMusic' || i.node === 'extras') && i.id && !STANDARD_MYMUSIC.test(i.id) && i.actions && i.actions.go)
        .sort((a, b) => (+a.weight || 0) - (+b.weight || 0) || String(a.text).localeCompare(String(b.text)));
      renderNav();
    } catch (e) { /* the menu is optional */ }
  }

  /** The LMS context menu for a library item, as a SlimBrowse action. */
  function contextMenu(kind, it) {
    if (kind === 'track') {
      if (it.id && +it.id > 0 && !it.remote) return { cmd: ['trackinfo', 'items'], params: { track_id: it.id, menu: 1 } };
      if (it.url) return { cmd: ['trackinfo', 'items'], params: { url: it.url, menu: 1 } };
      return null;
    }
    const map = { album: ['albuminfo', 'album_id'], artist: ['artistinfo', 'artist_id'], genre: ['genreinfo', 'genre_id'], year: ['yearinfo', 'year'] };
    const m = map[kind];
    return m && it.id != null ? { cmd: [m[0], 'items'], params: { [m[1]]: it.id, menu: 1 } } : null;
  }

  function jiveArt(item, size) {
    const id = item['icon-id'];
    if (id != null && /^-?[0-9a-f]+$/i.test(String(id))) return S.lms.cover(id, size);
    const src = item.image || item.icon || (id != null ? String(id) : '');
    return src ? S.lms.art(src, size) : null;
  }

  /** An item's action: its own, or the window's base action with the item's parameters. */
  function jiveAction(item, base, name) {
    if (item.actions && Object.prototype.hasOwnProperty.call(item.actions, name)) {
      const a = item.actions[name];
      if (!a) return null;
      if (a.itemsParams && item[a.itemsParams]) return Object.assign({}, a, { params: Object.assign({}, a.params, item[a.itemsParams]) });
      return a;
    }
    const b = base && base.actions && base.actions[name];
    if (!b) return null;
    return Object.assign({}, b, { params: Object.assign({}, b.params, (b.itemsParams && item[b.itemsParams]) || {}) });
  }

  function jiveArgs(a, input) {
    const sub = (v) => (input != null && typeof v === 'string' ? v.replace('__TAGGEDINPUT__', input).replace('__INPUT__', input) : v);
    const cmd = (a.cmd || []).map(sub);
    const params = [];
    for (const [k, v] of Object.entries(a.params || {})) if (v != null && v !== '') params.push(k + ':' + sub(v));
    return { cmd, params };
  }

  async function jiveFetch(a, start, count, input) {
    const { cmd, params } = jiveArgs(a, input);
    if (!(a.params && 'menu' in a.params)) params.push('menu:1');
    return S.lms.rpc(S.target || S.localId || '', [...cmd, start, count, ...params]);
  }

  async function jiveDo(a, input) {
    const { cmd, params } = jiveArgs(a, input);
    return S.lms.rpc(S.target || S.localId || '', [...cmd, ...params]);
  }

  function jiveNext(where, ctx) {
    pollSoon(150);
    if (where === 'parent') back();
    else if (where === 'grandparent') back(2);
    else if (where === 'home' || where === 'nowPlaying') root('now');
    else if ((where === 'refresh' || where === 'refreshOrigin') && ctx && ctx.reload) ctx.reload();
  }

  /** Only web addresses: a menu's link is never run as script or opened as a local file. */
  function safeLink(u) {
    try { const url = new URL(u, location.href); return /^https?:$/.test(url.protocol) ? url.href : null; } catch (e) { return null; }
  }

  const COMMAND_ACTIONS = ['play', 'add', 'add-hold', 'do', 'on', 'off'];

  /** The action a tap on the item means, as LMS's own controllers decide it. */
  function defaultAction(item, base) {
    if (item.goAction) return item.goAction;
    if (/item_?play/.test(item.style || '') && jiveAction(item, base, 'play')) return 'play';
    if (jiveAction(item, base, 'go')) return 'go';
    if (jiveAction(item, base, 'do')) return 'do';
    return null;
  }

  async function jiveActivate(item, base, name, ctx, actionOverride) {
    try {
      if (item.weblink && !name) { const u = safeLink(item.weblink); if (u) window.open(u, '_blank', 'noopener'); return; }
      const which = name || defaultAction(item, base);
      if (!which) return;
      const a = actionOverride || jiveAction(item, base, which);
      if (!a || !a.cmd) return;
      if (isLyrionJSApp(a.cmd)) { push('about', { recursion: true }); return true; }   // an LMS menu leading to LyrionJS itself
      let input = null;
      if (item.input || item.type === 'entry' || item.type === 'search' || JSON.stringify(a).includes('__TAGGEDINPUT__')) {
        input = await prompt2(firstLine(item.text) || tr('Search'), { placeholder: (item.input && item.input.help && item.input.help.text) || '', ok: tr('OK') });
        if (!input) return;
      }
      const title = firstLine(item.text);
      const next = a.nextWindow || item.nextWindow;
      const isCommand = !!next || COMMAND_ACTIONS.includes(which) || a.cmd[0] === 'playlistcontrol' || item.type === 'slideshow';
      if (!isCommand) { push('jive', { action: a, title, input }); return; }
      const r = await jiveDo(a, input);
      // A command that answered with a menu: show that answer (running it again could repeat it).
      if (r && r.item_loop && !next) { push('jive', { action: a, title, input, first: r }); return; }
      if (which === 'play') toast(tr('Playing')); else if (which === 'add') toast(tr('Added to the queue')); else if (which === 'add-hold') toast(tr('Playing next'));
      // A setting changed in place: show its new state.
      if (!next && (which === 'on' || which === 'off' || item.radio != null || item.choiceStrings)) { if (ctx.reload) ctx.reload(); pollSoon(150); return true; }
      jiveNext(next, ctx);
      return true;
    } catch (e) { fail(e); return false; }
  }

  const firstLine = (t) => String(t == null ? '' : t).split('\n')[0];

  function jiveRow(item, getBase, ctx) {
    const base = getBase();
    const lines = String(item.text == null ? '' : item.text).split('\n');
    const has = (n) => !!jiveAction(item, base, n);
    // Settings-style items: a switch, a choice, or one of a set.
    if (item.checkbox != null) {
      const sw = h('input', { type: 'checkbox', class: 'switch', checked: +item.checkbox === 1, 'aria-label': lines[0] });
      sw.addEventListener('change', async () => {
        if (!(await jiveActivate(item, base, sw.checked ? 'on' : 'off', ctx))) sw.checked = !sw.checked;   // failed: as it was
      });
      return h('label', { class: 'setting' }, h('span', { text: lines[0] }), sw);
    }
    const choices = item.actions && item.actions.do && item.actions.do.choices;
    if (Array.isArray(item.choiceStrings) && Array.isArray(choices)) {
      const sel = h('select', { class: 'select', 'aria-label': lines[0] },
        item.choiceStrings.map((t, i) => h('option', { value: i, text: t, selected: i === (+item.selectedIndex || 1) - 1 })));
      sel.addEventListener('change', () => jiveActivate(item, base, 'do', ctx, choices[+sel.value]));
      return h('label', { class: 'setting' }, h('span', { text: lines[0] }), sel);
    }
    const playable = has('play') || has('add');
    const clickable = !!item.weblink || !!defaultAction(item, base);
    if (!clickable && !playable) return h('div', { class: 'xml-text', text: lines.join('\n') });
    const art = jiveArt(item, 96);
    const menu = playable || has('more') ? () => sheet(lines[0], [
      has('play') ? { label: tr('Play now'), icon: 'play', run: () => jiveActivate(item, base, 'play', ctx) } : null,
      has('add-hold') ? { label: tr('Play next'), icon: 'next_up', run: () => jiveActivate(item, base, 'add-hold', ctx) } : null,
      has('add') ? { label: tr('Add to queue'), icon: 'add', run: () => jiveActivate(item, base, 'add', ctx) } : null,
      has('more') ? { label: tr('More…'), icon: 'more', run: () => push('jive', { action: jiveAction(item, base, 'more'), title: lines[0] }) } : null,
    ], { art: art || undefined, sub: lines[1] }) : null;
    return row({
      art: item.radio != null ? undefined : (art || (ctx.textOnly ? undefined : null)), artIcon: playable ? 'note' : 'folder',
      title: (item.radio != null ? (+item.radio === 1 ? '● ' : '○ ') : '') + lines[0], sub: lines.slice(1).join(' · ') || null,
      onclick: () => jiveActivate(item, base, null, ctx), menu,
    });
  }

  /**
   * p: { action, title?, input?, first?, navId? }. first: a command's answer that was a menu. The
   * command is never run again for that page (it may not be safe to repeat), so the page shows
   * just that answer: no further pages, no reload, and it isn't rebuilt for another player.
   */
  VIEWS.jive = (p) => {
    const holder = h('div');
    const answer = p.first || null;
    let base = null;
    const page = { title: p.title || '', el: holder, perPlayer: !answer };
    const ctx = { textOnly: false };
    const build = () => swap(holder, lazyList({
      page: 100, empty: tr('Nothing here.'),
      fetch: async (s, n) => {
        if (answer && s > 0) return { items: [], total: s, consumed: 0 };
        const r = answer || await jiveFetch(p.action, s, n, p.input);
        if (r.base) base = r.base;
        if (s === 0) {
          ctx.textOnly = !!(r.window && /text/.test(r.window.menustyle || r.window.windowStyle || ''));
          const t = (r.window && r.window.text) || r.title;
          if (t && !p.title) setTitle(page, t);
        }
        const items = r.item_loop || [];
        return { items, total: answer ? items.length : +r.count || 0, consumed: items.length };
      },
      render: (it) => jiveRow(it, () => base, ctx),
    }));
    // A setting changed on a command's answer: its switch already shows the new state.
    ctx.reload = answer ? () => pollSoon(150) : build;
    build();
    return page;
  };

  VIEWS.xml = (p) => {
    if (isLyrionJSApp(p.cmd)) return VIEWS.about({ recursion: true });   // however it was reached
    const holder = h('div');
    const page = { title: p.title || '', el: holder, perPlayer: true };
    const where = [...(p.item ? ['item_id:' + p.item] : []), ...(p.search ? ['search:' + p.search] : [])];
    const items = loopFetch((s, n) => rpc([p.cmd, 'items', s, n, 'want_url:1', ...where]), 'loop_loop');
    const inert = (it) => it.type === 'text' || it.type === 'textarea' || (!+it.hasitems && !+it.isaudio && it.type !== 'search' && it.type !== 'link');
    // LMS gives an item's web link (a plugin's "Donate" page, say) only in menu mode, so a page
    // with text items asks again in that mode for theirs, matched by name.
    const fetch = async (s, n) => {
      const r = await items(s, n);
      if (r.items.some(inert)) {
        try {
          const m = await rpc([p.cmd, 'items', s, n, 'menu:' + p.cmd, ...where]);
          const links = new Map((m.item_loop || []).filter((x) => x.weblink).map((x) => [firstLine(x.text), x.weblink]));
          for (const it of r.items) if (inert(it) && links.has(it.name || it.title || '')) it.weblink = links.get(it.name || it.title || '');
        } catch (e) { /* links are extra */ }
      }
      return r;
    };
    const build = () => swap(holder, lazyList({
      page: 200, empty: tr('Nothing here.'),
      fetch,
      render: (it) => {
        const name = it.name || it.title || '';
        const link = it.weblink && safeLink(it.weblink);
        if (link) return row({ art: xmlArt(it), artIcon: 'info', title: name, sub: it.line2 || null, onclick: () => window.open(link, '_blank', 'noopener') });
        if (inert(it)) return h('div', { class: 'xml-text', text: name });
        const isSearch = it.type === 'search';
        const go = async () => {
          if (isSearch) {
            const q = await prompt2(name || tr('Search'), { placeholder: tr('Search'), ok: tr('Search') });
            if (q) push('xml', { cmd: p.cmd, item: it.id, search: q, title: `${name}: ${q}` });
          } else if (+it.hasitems || it.type === 'link') push('xml', { cmd: p.cmd, item: it.id, title: name, fav: p.fav });
          else if (+it.isaudio) act([p.cmd, 'playlist', 'play', 'item_id:' + it.id], tr('Playing'));
        };
        const extra = p.fav ? [{ sep: true },
          { label: tr('Rename…'), icon: 'edit', run: async () => { const n = await prompt2(tr('Rename favourite'), { value: name, ok: tr('Rename') }); if (n) { await act(['favorites', 'rename', 'item_id:' + it.id, 'title:' + n], tr('Renamed'), ''); build(); } } },
          { label: tr('Remove from favourites'), icon: 'delete', danger: true, run: async () => { if (await confirm2(tr('Remove “{name}” from favourites?', { name }), tr('Remove'))) { await act(['favorites', 'delete', 'item_id:' + it.id], tr('Removed'), ''); build(); } } }] : [];
        return row({
          art: xmlArt(it), artIcon: isSearch ? 'search' : (+it.hasitems ? 'folder' : 'note'), title: name, sub: it.line2 || it.subtitle || null,
          onclick: go, menu: (+it.isaudio || p.fav) ? () => xmlMenu(p.cmd, it, extra) : null,
        });
      },
    }));
    build();
    return page;
  };

  VIEWS.favourites = () => VIEWS.xml({ cmd: 'favorites', title: tr('Favourites'), fav: true });

  function serviceList(kind) {
    return lazyList({
      page: 100, empty: kind === 'radios' ? tr('No radio services are installed on the server.') : tr('No apps are installed on the server.'),
      fetch: loopFetch((s, n) => rpc([kind, s, n], ''), kind + 's_loop', (x) => x.cmd),
      render: (a) => row({ art: S.lms.art(a.icon, 96), artIcon: kind === 'radios' ? 'radio' : 'apps', title: a.name,
        onclick: () => (isLyrionJSApp(a.cmd) ? push('about', { recursion: true }) : push('xml', { cmd: a.cmd, title: a.name })) }),
    });
  }
  VIEWS.radio = () => ({ title: tr('Radio'), el: serviceList('radios') });
  VIEWS.apps = () => ({ title: tr('Apps'), el: serviceList('apps') });

  VIEWS.random = () => {
    const kinds = [['tracks', tr('Songs'), 'note', tr('Random song mix started')], ['albums', tr('Albums'), 'album', tr('Random album mix started')],
      ['contributors', tr('Artists'), 'artist', tr('Random artist mix started')], ['year', tr('Years'), 'year', tr('Random year mix started')]];
    const el = h('div', { class: 'tiles' }, kinds.map(([k, t, i, msg]) => h('button', { class: 'tile', onclick: () => act(['randomplay', k], msg) }, icon(i), h('span', { text: t }))),
      h('button', { class: 'tile ghost', onclick: () => act(['randomplay', 'disable'], tr('Random mix stopped')) }, icon('stop'), h('span', { text: tr('Stop mix') })));
    return { title: tr('Random mix'), el: h('div', {}, h('p', { class: 'view-sub', text: tr('LMS keeps the queue topped up with random picks from your library.') }), el) };
  };
  // ---------------------------------------------------------------------------
  // The local Slimproto player
  // ---------------------------------------------------------------------------
  /**
   * Which output this device should use. Phones and tablets get the media element (it keeps
   * playing with the screen locked) if a self-test shows the browser plays our FLAC-in-MP4;
   * everything else, or a failed test, gets Web Audio. Settings can force either.
   */
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/plugins/LyrionJS/ws';

  async function chooseOutput() {
    const want = store.get('outputMode', (S.config && S.config.defaultOutput) || 'auto');
    const ua = navigator.userAgent;
    const ios = isIOS();
    const mobile = ios || /Android/.test(ua);
    // why: English, for the log; Settings shows it translated.
    let mode = 'webaudio', why = N_('desktop browser');
    if (want === 'webaudio') why = N_('chosen in Settings');
    else if (want !== 'media' && store.get('mediaUnusable', false)) why = N_('the media element failed here before');
    else if (want === 'media' || mobile) {
      const ok = LJ.mediaSupported() && await LJ.selfTest();
      if (ok) { mode = 'media'; why = want === 'media' ? N_('chosen in Settings') : ios ? N_('iPhone/iPad: keeps playing with the screen locked') : N_('Android: keeps playing with the screen locked'); }
      else why = ios ? N_('this browser cannot play FLAC through a media element (iOS 17.1 or later needed); keep the screen on') : N_('this browser cannot play FLAC through a media element');
    }
    diag('output', `mode ${mode} (${why}); ios=${ios} mobile=${mobile} mms=${!!window.ManagedMediaSource} mse=${!!window.MediaSource}`);
    S.outputMode = mode; S.outputWhy = why;
    if (mode === 'media') {
      const o = new LJ.MediaOutput(document.getElementById('lj-audio'), { diag });
      o.level = store.get('localLevel', store.get('localTrim', 1));
      // The OS paused us (a call, another app, headphones out): tell LMS, as a Squeezebox would.
      o.externalPause = () => { if (S.local && S.local.state === 'playing') act(['pause', 1], null, S.localId); };
      return o;
    }
    return new LJ.WebOutput({
      workletSource: document.getElementById('lj-worklet').textContent, diag,
      level: store.get('localLevel', store.get('localTrim', 1)), preferRate: store.get('outRate', 44100),
      onRate: (r) => store.set('outRate', r),
      // iPhone and iPad start a second audio context only inside a tap.
      singleContext: isIOS(),
    });
  }

  /** Starts this browser's player; a start already under way is shared, not repeated. */
  let starting = null;
  function startLocalPlayer() {
    if (!starting) starting = startNow().catch(fail).finally(() => { starting = null; });
    return starting;
  }

  async function startNow() {
    const wanted = () => !S.local && S.server && store.get('localEnabled', true);
    if (!wanted()) return;
    const mac = macBytes();
    S.localId = mac.str;
    // Ask once for this browser's storage to be kept, as it holds the player's MAC: lost, the
    // browser comes back as a new player. Only on HTTPS and localhost; Firefox asks the person.
    if (!store.get('persistAsked', false) && navigator.storage && navigator.storage.persist) {
      store.set('persistAsked', true);
      navigator.storage.persisted().then((p) => p || navigator.storage.persist()).catch(() => {});
    }
    if (!S.output) S.output = await chooseOutput();
    const [maxRate, mp3] = await Promise.all([S.outputMode === 'media' ? Promise.resolve(192000) : LJ.detectMaxRate(), detectMp3()]);
    if (!wanted()) return;   // switched off (or started) while the checks ran
    const caps = ['flc', 'pcm'].concat(mp3 ? ['mp3'] : []);
    const uuid = new Uint8Array(16); uuid.set(mac.bytes, 0);
    // Earlier versions named iPads "… on macOS" (iPadOS Safari reports a Mac).
    // Earlier test builds were misspelt "LyrianJS", and named iPads "… on macOS".
    const oldName = store.get('name', '');
    if (/^LyrianJS /.test(oldName) || (oldName === 'LyrionJS Safari on macOS' && defaultName() !== oldName)) store.set('name', defaultName());
    const decoders = { f: () => new LJ.FlacDecoder(), p: (s) => new LJ.PcmDecoder(s) };
    if (mp3 === 'webcodecs') decoders.m = () => new LJ.Mp3Decoder();
    else if (mp3 === 'chunks') decoders.m = () => new LJ.Mp3ChunkDecoder(decodeWithBrowser);
    const p = new LJ.SlimPlayer({
      mac: mac.bytes, uuid, name: store.get('name', defaultName()),
      openControl: () => LJ.controlSocket(WS_URL, LJ.browserEnv(), diag), openStream: (o) => LJ.openStream(o, LJ.browserEnv(), diag),
      output: S.output, now: () => performance.now(), caps, maxRate, decoders, firmware: VERSION,
      // Without AudioWorklet the output shares the main thread: decode in smaller slices.
      pumpBudget: window.AudioWorkletNode && window.isSecureContext ? 12 : 3,
      // A locked phone runs the page's code only now and then: keep more decoded ahead.
      decodeAhead: S.outputMode === 'media' ? 30 : 10,
      log: (...a) => console.warn('[slimproto]', ...a),
    });
    p.maxRateFound = maxRate;
    p.on((what) => {
      if (what === 'name') store.set('name', p.name);
      // The plugin ended this player: another session took it, or browser players were switched off.
      if (what === 'replaced' || what === 'disabled') {
        toast(what === 'replaced' ? tr('This player was taken over by another session; this page is now a remote control.')
          : tr('Browser players are switched off in LMS (Settings › Plugins › LyrionJS); this page is now a remote control.'));
        if (S.local === p) stopLocalPlayer();
        if (what === 'replaced') playerTaken();
        return;
      }
      if (what === 'state' || what === 'track' || what === 'connected') { pollSoon(150); refreshUnlock(); }
      if (what === 'connected') {
        setTimeout(pollPlayers, 400);
        if (!S.pluginMenus || !S.pluginMenus.length) setTimeout(loadPluginMenus, 800);
        setTimeout(maybeAskName, 2500);
        // Where the page can't set the volume (iOS), the device's buttons do: hold LMS at 100 %
        // (but leave it muted).
        if (S.output.volumeLocked && p.gain > 0.01 && Math.abs(p.gain - 1) > 0.01) act(['mixer', 'volume', 100], null, S.localId);
      }
      renderLocalBadge();
    });
    S.local = p;
    S.output.onState = refreshUnlock;
    // The media element failed and was replaced (output/media.js): what was queued is lost, so
    // start the current track again where it was.
    let lastRecovery = { index: -1, at: -1e9 };
    S.output.onFailure = async (why, wasPlaying, fatal) => {
      if (fatal) {
        diag('media', 'media element unusable: ' + why);
        // Chosen in Settings: say so, and leave the choice to the person.
        if (store.get('outputMode', 'auto') === 'media') { fail(new Error(tr('The media element can\'t play here: choose Web Audio in Settings › Audio output.'))); return; }
        // Automatic: this browser uses Web Audio from now on (Settings can still choose either).
        store.set('mediaUnusable', true);
        toast(tr('This browser can\'t play through the media element: switching to Web Audio…'));
        setTimeout(() => location.reload(), 1500);
        return;
      }
      diag('media', 'recovering after: ' + why);
      if (!wasPlaying) return;
      try {
        const st = await S.lms.rpc(S.localId, ['status', '-', 1]);
        const index = +st.playlist_cur_index || 0;
        // The same track failing again at once: it's the track, so go on to the next one.
        if (index === lastRecovery.index && performance.now() - lastRecovery.at < 30000) {
          diag('media', 'track ' + index + ' fails again: skipping it');
          lastRecovery = { index: -1, at: -1e9 };
          await S.lms.rpc(S.localId, ['playlist', 'index', '+1']);
          return;
        }
        lastRecovery = { index, at: performance.now() };
        await S.lms.rpc(S.localId, ['playlist', 'index', index]);
        if (+st.time > 1) await S.lms.rpc(S.localId, ['time', st.time]);
      } catch (e) { diag('error', 'recovery: ' + e.message); }
    };
    p.onStat = (ev) => { if (ev !== 'STMt') diag('stat', `${ev} state=${p.state}`); };
    p.onStrm = (s) => { if (s.command !== 't') diag('strm', `${s.command} autostart=${s.autostart} format=${s.format} threshold=${s.threshold} arg=${s.replayGain}`); };
    diag('player', `${p.name} ${mac.str} caps=${caps.join(',')} mp3=${mp3 || 'none'} maxRate=${maxRate} secure=${window.isSecureContext}`);
    const snapshot = setInterval(() => {
      if (p.state === 'stopped') return;
      const o = S.output, t = p.tracks.find((x) => !x.decoded) || p.tracks[p.tracks.length - 1];
      const out = o.el ? `el ${o.el.paused ? 'paused' : 'playing'} t=${o.el.currentTime.toFixed(2)} end=${o.writer.end.toFixed(2)} ops=${o.sbq.ops.length} full=${o.sbq.full} unlocked=${o.unlocked}`
        : `ctx=${o.ctx ? o.ctx.state + '@' + o.rate : 'none'} src=${o.srcRate} rep=${o.rep ? `pos ${o.rep.pos} q ${o.rep.queued} playing ${o.rep.playing} under ${o.rep.under}` : 'none'} pending=${o.pending.length} posts=${o.posts.length}`;
      diag('snap', `state=${p.state} conn=${p.connected} queued=${o.queuedSeconds().toFixed(1)}s ${out} ` +
        `track=${t ? `#${t.seq} ${t.format} bytes ${t.bytes} buf ${t.decoder ? t.decoder.buffered : '-'} open ${t.streamOpen} decoded ${t.decoded} ${t.describe}` : 'none'} err=${p.lastError || '-'}`);
    }, 3000);
    const onHide = () => { try { p.stop(); } catch (e) { /* closing */ } };
    window.addEventListener('pagehide', onHide);
    S.localCleanup = () => { clearInterval(snapshot); window.removeEventListener('pagehide', onHide); };
    p.start();
  }

  function stopLocalPlayer() {
    if (!S.local) return;
    S.local.stop(); S.local = null;
    if (S.localCleanup) { S.localCleanup(); S.localCleanup = null; }
    clearMediaSession();
    renderLocalBadge();
  }

  /**
   * Only one tab per browser may be the player: two would share a MAC, and the plugin would give
   * the player to the newer one, cutting off what the first was playing. So the first tab keeps
   * it for its life (switching the player off and on again reuses it); the others are remote
   * controls, and one of them takes over when it closes. The browser's lock does this where it
   * has one (HTTPS and localhost); elsewhere the tabs ask each other on a channel.
   */
  const ASK_MS = 400;   // for the player tab to answer a new one
  let claim = null;     // null, 'asking' (the other tabs), 'waiting' (a remote control) or 'lock'
  let chan = null, asked = null, askTimer = 0;
  function ownPlayer() { S.ownsPlayer = true; startLocalPlayer(); }
  function beRemote() {
    claim = claim === 'lock' ? 'lock' : 'waiting';
    toast(tr('Another tab is this browser\'s player; this one is a remote control.'));
  }
  function claimPlayerThenStart() {
    if (S.ownsPlayer) { startLocalPlayer(); return; }
    if (claim === 'asking') return;
    if (claim) { beRemote(); return; }
    if (navigator.locks && navigator.locks.request) {
      claim = 'lock';
      const hold = () => { ownPlayer(); return new Promise(() => {}); };   // for the life of the tab
      navigator.locks.request('lyrionjs-player', { ifAvailable: true }, (lock) => {
        if (lock) return hold();
        beRemote();
        navigator.locks.request('lyrionjs-player', hold);   // granted when the player tab closes
        return null;
      });
    } else if (window.BroadcastChannel) {
      if (!chan) {
        chan = new BroadcastChannel('lyrionjs-player');
        chan.onmessage = ({ data: m }) => {
          if (!m || typeof m !== 'object') return;
          // Two tabs asking at once: the one that asked first goes ahead.
          const first = asked && claim === 'asking' && (asked.at < m.at || (asked.at === m.at && asked.id < m.id));
          if (m.t === 'who' && (S.ownsPlayer || first)) chan.postMessage({ t: 'mine' });
          else if (m.t === 'mine' && claim === 'asking') { clearTimeout(askTimer); beRemote(); }
          else if (m.t === 'gone' && claim === 'waiting') { claim = null; setTimeout(claimPlayerThenStart, Math.random() * 200); }
        };
        window.addEventListener('pagehide', () => { if (S.ownsPlayer) chan.postMessage({ t: 'gone' }); });
      }
      claim = 'asking'; asked = { t: 'who', at: Date.now(), id: Math.random() };
      chan.postMessage(asked);
      askTimer = setTimeout(() => { claim = null; ownPlayer(); }, ASK_MS);
    } else ownPlayer();
  }
  /** The plugin gave this browser's player to another tab: this one waits for it, as a remote control. */
  function playerTaken() {
    if (S.ownsPlayer && claim !== 'lock') { S.ownsPlayer = false; claim = 'waiting'; }
  }

  // Back from the back/forward cache: the player stopped when the page was hidden; start afresh.
  window.addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

  function refreshUnlock() {
    const el = document.getElementById('unlock');
    const need = S.local && S.output && S.output.needsGesture && ['playing', 'waiting', 'loaded', 'paused'].includes(S.local.state);
    el.hidden = !need;
  }
  // -- naming ---------------------------------------------------------------------
  /** Lets the person name this browser's player (in LMS, so every controller shows it). */
  async function renameLocal(first) {
    if (!S.local) return;
    const n = await prompt2(first ? tr('Give this player a name') : tr('Name this player'), first
      ? { value: '', placeholder: tr('e.g. Kitchen tablet'), ok: tr('Save'), hint: tr('How this browser shows in LMS and your other controllers. Change it any time in Settings.') }
      : { value: S.local.name, placeholder: tr('e.g. Kitchen tablet'), ok: tr('Save') });
    store.set('named', true);   // asked once: never ask again by ourselves
    if (!S.local || !n || n === S.local.name) return;   // (the player may have been switched off meanwhile)
    const name = n.slice(0, 48);
    try { await S.lms.rpc(S.localId, ['name', name]); } catch (e) { fail(e); return; }
    S.local.name = name; store.set('name', name);
    toast(tr('This player is now “{name}”', { name }));
    renderLocalBadge();
    await pollPlayers().catch(() => {});
    renderPlayerButton();
  }

  /** The first time this browser is a player with the name it was given automatically, ask. */
  let askedName = false;
  async function maybeAskName() {
    if (askedName || store.get('named', false) || !S.local) return;
    askedName = true;
    await pollPlayers().catch(() => {});
    const known = S.players.find((x) => x.playerid === S.localId);
    const name = known ? known.name : S.local.name;
    if (name !== defaultName()) { store.set('named', true); return; }   // already named (perhaps in another controller)
    // Not over a dialog, nor while the person is typing somewhere (the prompt would take the keys).
    const busy = !document.getElementById('sheet').hidden || (document.activeElement && document.activeElement.matches('input, textarea, select'));
    if (!busy) renameLocal(true).catch(fail);
    else askedName = false;   // try again when they next connect
  }

  function renderLocalBadge() {
    const el = document.getElementById('localBadge');
    if (!el) return;
    el.textContent = '';
    if (!S.local) { el.append(tr('Browser player off')); el.className = 'badge off'; el.title = ''; el.disabled = true; return; }
    el.disabled = false;
    const snap = S.local.snapshot();
    el.className = 'badge ' + (snap.connected ? 'on' : 'warn');
    el.append(snap.connected ? `${S.local.name} · ${stateWord(snap.state)}` : tr('Connecting to LMS…'));
    el.title = tr('Rename this player');
  }

  /** 'webcodecs' (streaming, exact), 'chunks' (decodeAudioData fallback) or '' (no MP3). */
  async function detectMp3() {
    if (LJ.Mp3Decoder.supported()) {
      try { const r = await AudioDecoder.isConfigSupported({ codec: 'mp3', sampleRate: 44100, numberOfChannels: 2 }); if (r.supported) return 'webcodecs'; }
      catch (e) { /* fall through */ }
    }
    return typeof OfflineAudioContext === 'function' ? 'chunks' : '';
  }
  function decodeWithBrowser(bytes, rate, channels) {
    const ctx = new OfflineAudioContext(channels, 1, rate);
    const buf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    return ctx.decodeAudioData(buf).then((b) => { const out = []; for (let c = 0; c < b.numberOfChannels; c++) out.push(b.getChannelData(c)); return out; });
  }

  // ---------------------------------------------------------------------------
  // Media Session (lock screen / media keys) for this browser's player
  // ---------------------------------------------------------------------------
  let lastMeta = '';
  /** The lock screen no longer shows this browser as playing, nor sends it commands. */
  function clearMediaSession() {
    lastMeta = null;
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = 'none';
    for (const a of ['play', 'pause', 'nexttrack', 'previoustrack', 'stop', 'seekto']) {

   * own page in a skin (Light and Classic: /<skin>/plugins/lyrionjs/index.html).
   */
  const isPageUrl = (u) => { try { return /^(?:\/[^/]+)?\/plugins\/lyrionjs\/(?:index\.html)?$/i.test(new URL(u, location.href).pathname); } catch (e) { return false; } };
  /**
   * Each page the frame shows, and the frames inside it (Light and Classic are framesets): a tap
   * or key in it can start the sound here, and the skin's ways to LyrionJS (Material's tile opens
   * a window, an app's link is followed) come to this page instead of opening another. Looked at
   * often (below), so a page just loaded is caught soon.
   */
  function hookFrame(w) {
    let d; try { d = w.document; } catch (e) { return; }   // another origin: nothing to do there
    if (!d) return;
    if (!d.ljHooked) {
      d.ljHooked = true;
      for (const ev of ['touchend', 'click', 'keydown']) d.addEventListener(ev, unlock, true);
      d.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (a && isPageUrl(a.href)) { e.preventDefault(); e.stopPropagation(); toPage(a.href); }
      }, true);
      const open = w.open;
      w.open = function (u, ...rest) { if (u && isPageUrl(String(u))) { toPage(String(u)); return null; } return open.call(this, u, ...rest); };
    }
    for (let i = 0; i < w.frames.length; i++) hookFrame(w.frames[i]);
  }
  setInterval(() => {
    if (!hostFrame || !hostFrame.contentWindow) return;
    hookFrame(hostFrame.contentWindow);
    // The tab's name: LyrionJS's, not the skin's (Material's says the player's MAC address).
    const t = hostName() + ' · LyrionJS';
    if (!hostOwn() && document.title !== t) document.title = t;
  }, 300);

  /** A way to LyrionJS followed in the skin: to the skin it names, else LyrionJS's own pages. */
  const toPage = (u) => (skinParam(u) ? useSkin(skinParam(u)) : enterOwn());
  /** From the LMS skin to LyrionJS's own pages, a step in the history (so Back returns). */
  function enterOwn() {
    if (!document.documentElement.dataset.host || hostOwn()) return;
    document.documentElement.classList.add('host-own');
    root('about', { recursion: true });
    history.pushState(navState(1), '');
  }
  /** Back to the skin: all of LyrionJS's steps in the history (popstate, in router.js, does the rest). */
  function leaveOwn() {
    if (!hostOwn()) return;
    if (history.state && history.state.own) history.go(-S.nav.length);
    else document.documentElement.classList.remove('host-own');
  }
  document.getElementById('skinBtn').onclick = leaveOwn;

  // -- Home: what the menu offers, as a grid (Material's "Browse") -----------------------------
  VIEWS.home = () => {
    const tiles = [];
    for (const n of NAV) {
      if (n === 'plugins') {
        for (const m of S.pluginMenus || []) {
          const art = jiveArt(m, 96);
          tiles.push(h('button', { class: 'home-item', onclick: () => push('jive', { action: m.actions.go, title: m.text }) },
            art ? h('img', { class: 'home-img', src: art, alt: '' }) : icon('apps'), h('span', { text: m.text })));
        }
        continue;
      }
      if (!n || ['home', 'now', 'queue', 'search'].includes(n[0])) continue;   // search: the button over the page
      tiles.push(h('button', { class: 'home-item', onclick: () => push(n[0]) }, icon(n[2]), h('span', { text: tr(n[1]) })));
    }
    return { title: tr('Home'), el: h('div', { class: 'home' }, tiles) };
  };

  // -- Now playing over the page (Material's expanded now playing) -------------------------------
  /** Opens now playing; with the Material skin over the page, so closing it goes back to where it was. */
  function openNow() {
    if (skin() === 'material' && S.shown && S.shown.name !== 'now') push('now');
    else root('now');
  }
  function closeNow() {
    if (S.nav.length > 1) back();
    else root(store.get('browseView', 'home'));
  }

  // -- The queue beside the page (Material's desktop layout) -------------------------------------
  let sidePage = null;
  function sideWanted() {
    const v = S.shown && S.shown.name;
    return skin() === 'material' && !narrow.matches && store.get('sideQueue', false) && v !== 'now' && v !== 'queue' && !!S.lms;
  }
  function updateSide() {
    const el = document.getElementById('side'), sb = document.getElementById('sideBtn');
    const want = sideWanted();
    if (sb) sb.setAttribute('aria-pressed', String(skin() === 'material' && store.get('sideQueue', false)));
    if (want && !sidePage) {
      sidePage = VIEWS.queue();
      el.replaceChildren(h('div', { class: 'view-head side-head' }, h('h2', { text: tr('Queue') }), h('div', { class: 'view-actions' }, sidePage.actions || [])), sidePage.el);
      if (sidePage.onShow) sidePage.onShow();
    }
    else if (!want && sidePage) closeSide();
    el.hidden = !want;
  }
  function closeSide() {
    if (!sidePage) return;
    if (sidePage.onHide) sidePage.onHide();
    disposeLists(sidePage.el);
    sidePage = null;
    document.getElementById('side').textContent = '';
  }
  /** Another player: its queue. */
  function sidePlayerChanged() { if (sidePage) { closeSide(); updateSide(); } }
  narrow.addEventListener('change', updateSide);
  // Material's search button, over the page.
  document.getElementById('fab').onclick = () => root('search');
  document.getElementById('sideBtn').onclick = () => {
    // On a narrow screen there's no room beside the page: the queue opens instead.
    if (narrow.matches) { root('queue'); return; }
    store.set('sideQueue', !store.get('sideQueue', false));
    if (S.shown && S.shown.name === 'queue' && store.get('sideQueue', false)) closeNow();
    updateSide();
  };
  // ---------------------------------------------------------------------------
  // Keyboard, boot
  // ---------------------------------------------------------------------------
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSheet(); document.body.classList.remove('nav-open'); return; }   // also while typing
    if (!document.body.classList.contains('ready') || !S.lms) return;   // not before the app has started
    if (e.target.closest('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === ' ') {
      if (e.target.closest('button, [role="button"], a')) return;   // Space activates what has focus
      e.preventDefault(); togglePlay();
    }
    else if (e.key === 'ArrowRight') act(['playlist', 'index', '+1']);
    else if (e.key === 'ArrowLeft') act(['button', 'jump_rew']);
    else if (e.key === 'ArrowUp') { e.preventDefault(); act(['mixer', 'volume', '+5']); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); act(['mixer', 'volume', '-5']); }
    else if (e.key === 'm' || e.key === 'M') act(['mixer', 'muting', 'toggle']);
    else if (e.key === '/') { e.preventDefault(); root('search'); }
  });
  // Browsers only let audio start inside a user gesture. On iPad a touch counts on touchend or
  // click, not pointerdown, and the audio context must be created or resumed right there.
  const unlock = () => { if (S.output) S.output.unlock(); refreshUnlock(); };
  for (const ev of ['touchend', 'click', 'keydown']) document.addEventListener(ev, unlock, true);
  // Safari 17+: play as media, so the silent switch and Control Centre's silent mode don't mute it.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* older Safari */ }

  // LMS not answering when the page opened (often a restart in progress): ask again now and then,
  // and start afresh once it answers.
  const BOOT_RETRY_MS = 5000;
  function unreachable(msg) {
    document.getElementById('view').replaceChildren(h('div', { class: 'discover' },
      h('div', { class: 'logo' }, logo()), h('h1', { text: 'LyrionJS' }),
      h('p', { text: tr('Lyrion Music Server is not answering at {host}.', { host: location.host }) }),
      h('p', { class: 't2', text: (msg ? msg.replace(/\.$/, '') + '. ' : '') + tr('Trying again every few seconds…') }),
      h('button', { class: 'btn', onclick: () => location.reload() }, icon('refresh'), tr('Try again'))));
    const retry = async () => {
      try { await S.lms.rpc('', ['version', '?'], 5000); location.reload(); }
      catch (e) { setTimeout(retry, document.hidden ? 6 * BOOT_RETRY_MS : BOOT_RETRY_MS); }
    };
    setTimeout(retry, BOOT_RETRY_MS);
  }

  /**
   * Inside another page's frame (Material Skin opens its Extras that way), the player stops when
   * that window closes: offer it a tab of its own, or carry on here.
   */
  function leaveFrame() {
    let inFrame = true;
    try { inFrame = window.top !== window; } catch (e) { /* a parent on another origin */ }
    if (!inFrame) return Promise.resolve();
    // Opened from the LMS skin that this tab's LyrionJS shows: that one is already the player.
    let host = null;
    try { host = window.top.LyrionJS && window.top.LyrionJS.showOwn ? window.top.LyrionJS : null; } catch (e) { /* another origin */ }
    if (host) {
      // Material's Extras opens it in a dialog: show LyrionJS's own pages out there (or the skin this link names).
      if (linkSkin && host.useSkin) host.useSkin(linkSkin); else host.showOwn();
      document.getElementById('view').replaceChildren(h('div', { class: 'discover' },
        h('div', { class: 'logo' }, logo()), h('h1', { text: 'LyrionJS' }),
        h('p', { text: tr('This tab is already playing with LyrionJS.') }),
        h('button', { class: 'btn', onclick: () => host.showOwn() }, tr('Show LyrionJS'))));
      return new Promise(() => {});   // and nothing more here
    }
    return new Promise((resolve) => {
      document.getElementById('view').replaceChildren(h('div', { class: 'discover' },
        h('div', { class: 'logo' }, logo()), h('h1', { text: 'LyrionJS' }),
        h('p', { text: tr('LyrionJS plays best in a tab of its own: in this window it stops when the window closes.') }),
        h('div', { class: 'row-btns' },
          h('a', { class: 'btn', href: location.origin + location.pathname, target: '_blank', rel: 'noopener' }, icon('play'), tr('Open in a new tab')),
          h('button', { class: 'btn ghost', onclick: () => resolve() }, tr('Use it here')))));
    });
  }

  /** The language changed: the page's text again, without a reload (the music plays on). */
  function relang() {
    applyLang();
    renderNav();
    const bar = document.getElementById('bar');
    if (bar._els) { bar.textContent = ''; bar._els = null; updateBar(); }
    renderPlayerButton(); renderLocalBadge();
    closeSide(); updateSide();
    if (S.nav.length) { for (const e of S.nav) dispose(e); S.shown = null; show(S.nav[S.nav.length - 1]); }
  }

  async function boot() {
    applyLang();
    applyTheme();
    applySkin();
    renderNav();
    await leaveFrame();
    document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
    // The menu button says whether the drawer is open, whoever opened or closed it.
    new MutationObserver(() => document.getElementById('menuBtn').setAttribute('aria-expanded', String(document.body.classList.contains('nav-open'))))
      .observe(document.body, { attributes: true, attributeFilter: ['class'] });
    document.getElementById('scrim').onclick = () => document.body.classList.remove('nav-open');
    document.getElementById('playerBtn').onclick = () => S.lms && playerPicker();
    document.getElementById('localBadge').onclick = () => renameLocal();
    document.getElementById('unlock').onclick = unlock;
    S.lms = new LMS();
    try {
      const v = await S.lms.rpc('', ['version', '?'], 8000);
      let name = '';
      try { name = (await S.lms.rpc('', ['pref', 'libraryname', '?'], 5000))._p2 || ''; } catch (e) { /* older LMS */ }
      S.server = { name: name || 'Lyrion Music Server', version: v._version };
    } catch (e) { unreachable(e.message); return; }
    if (await learnLmsLang()) relang();   // LMS's language, if it changed since last time
    document.getElementById('serverName').textContent = S.server.name;
    document.body.classList.add('ready');
    S.localId = macBytes().str;
    try { S.config = serverConfig = await (await fetch(`/plugins/LyrionJS/config.json?mac=${encodeURIComponent(S.localId)}`, { cache: 'no-store' })).json(); } catch (e) { S.config = serverConfig = {}; }
    notePage(S.config);
    if (S.config.enabled === 0) toast(tr('Browser players are switched off in LMS (Settings › Plugins › LyrionJS). This page controls your other players.'));
    else claimPlayerThenStart();
    history.replaceState({ d: 1 }, '');
    const saved = store.get('view', 'now');
    root(VIEWS[saved] ? saved : 'now');
    try { await pollPlayers(); } catch (e) { setConn(false, e.message); }
    setTimeout(updateHost, HOST_WAIT_MS);   // no player of its own here: the skin shows another
    if (S.target && S.players.some((p) => p.playerid === S.target)) loadPluginMenus();
    poll();
  }

  // For diagnostics from the browser console; showOwn: for a LyrionJS page opened from the LMS skin shown here.
  window.LyrionJS = { S, VERSION, showOwn: () => enterOwn(), useSkin: (v) => useSkin(v) };
  boot();
})();
</script>
<script>

(function () {
  'use strict';

  // WEBOS_TV_SPATIAL_NAV_V1
  var selector = [
    'button', 'a[href]', 'input', 'select',
    'textarea', '[role="button"]', '[role="tab"]',
    '[role="option"]', '[role="menuitem"]',
    '[tabindex]:not([tabindex="-1"])'
  ].join(',');

  var current = null;

  // Visible, usable elements only.
  function candidates() {
    var nodes = document.querySelectorAll(selector);
    var result = [];

    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var r = el.getBoundingClientRect();
      var s = window.getComputedStyle(el);

      if (r.width < 2 || r.height < 2 ||
          s.display === 'none' ||
          s.visibility === 'hidden' ||
          el.disabled ||
          el.getAttribute('aria-hidden') === 'true') {
        continue;
      }

      // Exclude elements outside the viewport.
      if (r.bottom <= 0 || r.top >= innerHeight ||
          r.right <= 0 || r.left >= innerWidth) {
        continue;
      }

      result.push(el);
    }

    return result;
  }

  function centre(el) {
    var r = el.getBoundingClientRect();
    return {
      x: r.left + r.width / 2,
      y: r.top + r.height / 2
    };
  }

  function focus(el) {
    if (current) {
      current.classList.remove('tv-focused');
    }

    current = el;

    if (!el) return;

    el.classList.add('tv-focused');
    if (typeof el.focus === 'function') {
      el.focus();
    }
    if (typeof el.scrollIntoView === 'function') {
      el.scrollIntoView({
        block: 'nearest',
        inline: 'nearest'
      });
    }
  }

  function move(key) {
    var items = candidates();
    if (!items.length) return;

    if (!current || items.indexOf(current) < 0) {
      focus(items[0]);
      return;
    }

    var origin = centre(current);
    var best = null;
    var bestScore = Infinity;

    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      if (el === current) continue;

      var p = centre(el);
      var dx = p.x - origin.x;
      var dy = p.y - origin.y;
      var primary, secondary;

      if (key === 37) {
        primary = -dx;
        secondary = Math.abs(dy);
      } else if (key === 39) {
        primary = dx;
        secondary = Math.abs(dy);
      } else if (key === 38) {
        primary = -dy;
        secondary = Math.abs(dx);
      } else {
        primary = dy;
        secondary = Math.abs(dx);
      }

      if (primary <= 0) continue;

      // Prefer the intended direction, then proximity.
      var score = primary + secondary * 3;

      if (score < bestScore) {
        bestScore = score;
        best = el;
      }
    }

    if (best) focus(best);
  }

  function isTextField(el) {
    if (!el) return false;

    var tag = el.tagName;
    return tag === 'INPUT' ||
           tag === 'TEXTAREA' ||
           el.isContentEditable;
  }

  document.addEventListener('keydown', function (e) {
    var key = e.keyCode || e.which;

    // Leave text editing to the browser.
    if (isTextField(document.activeElement)) {
      return;
    }

    if (key >= 37 && key <= 40) {
      e.preventDefault();
      e.stopPropagation();
      move(key);
    } else if (key === 13) {
      if (current && document.contains(current)) {
        e.preventDefault();
        e.stopPropagation();
        current.click();
      }
    }
  }, true);

  // Match focus to pointer interaction too.
  document.addEventListener('mouseover', function (e) {
    var el = e.target;
    while (el && el !== document.body) {
      if (el.matches && el.matches(selector)) {
        if (el !== current) focus(el);
        break;
      }
      el = el.parentElement;
    }
  }, false);

  // Preserve the visible indicator across redraws.
  var style = document.createElement('style');
  style.textContent =
    '.tv-focused {' +
    'outline: 4px solid #24b8ff !important;' +
    'outline-offset: 3px !important;' +
    'box-shadow: 0 0 0 2px #111 !important;' +
    '}' +
    '.tv-focused:focus { outline: 4px solid #24b8ff !important; }';

  document.head.appendChild(style);
})();

</script>
</body>
</html>
