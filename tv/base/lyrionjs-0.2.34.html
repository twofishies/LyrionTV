<style>
:root {
  --bg: #0f1115; --bg2: #161920; --bg3: #1e222b; --line: #2a2f3a; --fg: #e9ebf0; --fg2: #a3a9b6; --fg3: #6f7685;
  --accent: #f2a541; --accent2: #ffcf8a; --on-accent: #1b1406; --danger: #ff6b6b; --ok: #5ad19a; --warn: #f2c94c;
  --radius: 12px; --shadow: 0 10px 40px rgba(0, 0, 0, .45); --nav: 232px; --bar: 76px; --top: 56px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f6f3; --bg2: #ffffff; --bg3: #eceae4; --line: #dedbd2; --fg: #1d1f24; --fg2: #555b66; --fg3: #8a909b;
    --accent: #c46d08; --accent2: #e08a1e; --on-accent: #fff; --shadow: 0 10px 40px rgba(0, 0, 0, .15); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f6f3; --bg2: #ffffff; --bg3: #eceae4; --line: #dedbd2; --fg: #1d1f24; --fg2: #555b66; --fg3: #8a909b;
  --accent: #c46d08; --accent2: #e08a1e; --on-accent: #fff; --shadow: 0 10px 40px rgba(0, 0, 0, .15); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* iPhone notch and home bar (the page asks for viewport-fit=cover) */
body { padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) 0 env(safe-area-inset-left, 0); }
#bar { padding-bottom: env(safe-area-inset-bottom, 0); }
.sheet-panel { margin-bottom: env(safe-area-inset-bottom, 0); }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  display: grid; grid-template-columns: var(--nav) minmax(0, 1fr); grid-template-rows: var(--top) 1fr var(--bar);
  grid-template-areas: "top top" "nav main" "bar bar"; overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

.ic { width: 22px; height: 22px; fill: currentColor; flex: none; }
.ic.huge { width: 72px; height: 72px; opacity: .35; }
.ib { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; color: var(--fg2); transition: background .15s, color .15s; flex: none; }
.ib:hover { background: var(--bg3); color: var(--fg); }
.ib.on { color: var(--accent); }
.ib.big { width: 64px; height: 64px; background: var(--accent); color: var(--on-accent); }
.ib.big .ic { width: 34px; height: 34px; }
.ib.big:hover { background: var(--accent2); color: var(--on-accent); }
.ib.mid { width: 46px; height: 46px; background: var(--fg); color: var(--bg); }
.ib.mid:hover { background: var(--accent); color: var(--on-accent); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
.btn .ic { width: 18px; height: 18px; }
.btn:hover { background: var(--accent2); }
.btn.ghost { background: var(--bg3); color: var(--fg); }
.btn.ghost:hover { background: var(--line); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.row-btns.pad { margin: 0 0 12px; }

/* Top bar */
#top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.brand { font-weight: 800; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.about { display: flex; gap: 16px; align-items: flex-start; }
.about-logo { width: 64px; height: 64px; flex: none; }
.about > div { flex: 1; min-width: 0; }
.about-name { font-weight: 800; font-size: 17px; margin-top: 4px; }
.about-text { margin: 6px 0 0; color: var(--fg3); font-size: 13px; line-height: 1.45; }
.brand-logo { width: 28px; height: 28px; flex: none; filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }
#serverName { color: var(--fg3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
#menuBtn { display: none; }
#playerBtn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--bg3); max-width: 46vw; }
#playerBtn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#playerBtn .ic { width: 18px; height: 18px; }
#playerBtn .caret { width: 16px; height: 16px; opacity: .6; }
.badge { cursor: pointer; border: 0; font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--bg3); color: var(--fg2); white-space: nowrap; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
.badge.on::before, .badge.warn::before, .badge.off::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.badge.on::before { background: var(--ok); } .badge.warn::before { background: var(--warn); } .badge.off::before { background: var(--fg3); }

/* Navigation */
#nav { grid-area: nav; overflow-y: auto; padding: 10px 8px 24px; border-right: 1px solid var(--line); background: var(--bg2); }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border-radius: 10px; color: var(--fg2); text-align: left; }
.nav-item:hover { background: var(--bg3); color: var(--fg); }
.nav-item.active { background: var(--bg3); color: var(--accent); font-weight: 600; }
.nav-item .ic { width: 20px; height: 20px; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 10px; }
#scrim { display: none; }

/* Main view */
#view { grid-area: main; overflow-y: auto; padding: 0 24px 40px; scroll-behavior: auto; }
.view-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; background: linear-gradient(var(--bg) 75%, transparent); }
.view-head h1 { margin: 0; font-size: 24px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view-actions { display: flex; align-items: center; gap: 4px; }
.view-sub { color: var(--fg2); margin: 0 0 12px; }
h3.section { margin: 22px 0 8px; font-size: 16px; color: var(--fg2); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.empty { color: var(--fg3); padding: 32px 8px; text-align: center; }
.select { background: var(--bg3); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; max-width: 100%; }
.field { width: 100%; background: var(--bg3); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font: inherit; }
.field:focus { outline: none; border-color: var(--accent); }
.search-form { display: flex; gap: 8px; margin-bottom: 12px; }

/* Artwork */
.art { position: relative; flex: none; display: grid; place-items: center; background: var(--bg3); border-radius: 8px; overflow: hidden; color: var(--fg3); }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
.art.loaded img { opacity: 1; }
.art.loaded .ph { opacity: 0; }
.art.sm { width: 44px; height: 44px; border-radius: 6px; }
.art.sm .ic { width: 20px; height: 20px; }
.art.lg { width: 100%; aspect-ratio: 1; }
.art.lg .ic { width: 40%; height: 40%; opacity: .5; }
.art.xl { width: 100%; aspect-ratio: 1; border-radius: 16px; box-shadow: var(--shadow); }
.art.xl .ic { width: 30%; height: 30%; opacity: .4; }
.art.round, .card.round .art { border-radius: 50%; }

/* Lists and grids */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 10px; min-height: 56px; }
.row[role="button"] { cursor: pointer; }
.row[role="button"]:hover { background: var(--bg2); }
.row.current { background: var(--bg3); }
.row.current .t1 { color: var(--accent); font-weight: 600; }
.row.dim { opacity: .5; }
.row.dragging { opacity: .4; }
.row.over { box-shadow: inset 0 2px 0 var(--accent); }
.row[aria-expanded="true"] { background: var(--bg2); border-radius: 10px 10px 0 0; }
.row-actions { display: flex; gap: 8px; padding: 2px 8px 10px; overflow-x: auto; scrollbar-width: thin; background: var(--bg2); border-radius: 0 0 10px 10px; }
.row-actions .btn { flex: none; height: 80px; aspect-ratio: 2; flex-direction: column; justify-content: center; gap: 6px; padding: 6px; border-radius: 12px;
  font-size: 12px; line-height: 1.15; text-align: center; overflow: hidden; }
.row-actions .btn .ic { width: 26px; height: 26px; flex: none; }
.setting.stack { flex-direction: column; align-items: stretch; gap: 10px; }
.setting.stack .swatches { justify-content: flex-start; }
.setting.stack select { max-width: 100%; }
.tap-items .btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.row .meta { flex: 1; min-width: 0; }
.t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t1.big { font-size: 22px; font-weight: 700; }
.t2 { color: var(--fg2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .right { color: var(--fg3); font-size: 13px; font-variant-numeric: tabular-nums; }
.row .num { width: 28px; text-align: right; color: var(--fg3); font-variant-numeric: tabular-nums; flex: none; }
.row .more { width: 34px; height: 34px; opacity: .55; }
.row:hover .more { opacity: 1; }
.disc { color: var(--fg3); font-weight: 700; padding: 14px 8px 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.xml-text { color: var(--fg2); padding: 8px; white-space: pre-wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 18px 16px; }
.card { position: relative; cursor: pointer; min-width: 0; border-radius: var(--radius); padding: 6px; }
.card:hover { background: var(--bg2); }
.card .t1 { margin-top: 8px; font-weight: 600; font-size: 14px; }
.card .more { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, .55); color: #fff; width: 32px; height: 32px; opacity: 0; }
.card:hover .more, .card:focus-within .more { opacity: 1; }
.sentinel { height: 40px; }
.sentinel.busy { background: radial-gradient(circle, var(--fg3) 2px, transparent 3px) center / 14px 14px repeat-x; opacity: .6; animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .15; } }

/* Hero (album / artist) */
.hero { display: flex; gap: 22px; align-items: flex-end; margin: 4px 0 18px; }
.hero-art { width: 220px !important; height: 220px; aspect-ratio: 1; border-radius: 14px; box-shadow: var(--shadow); }
.hero-art .ic { width: 40%; height: 40%; }
.hero-meta { min-width: 0; }
.hero-meta h2 { margin: 0 0 4px; font-size: 30px; line-height: 1.15; }
.np-link { color: var(--fg2); padding: 0; text-align: left; }
.np-link:not(:disabled):hover { color: var(--accent); text-decoration: underline; }

/* Now playing */
.np { display: grid; grid-template-columns: minmax(240px, 460px) minmax(280px, 1fr); gap: 40px; align-items: center; padding: 10px 0 30px; max-width: 1100px; }
.np-art { width: 100%; }
.np-info { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.np-title { font-size: 32px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.np-sub { display: flex; flex-direction: column; gap: 2px; font-size: 18px; }
.np-station { color: var(--fg3); }
.np-quality { display: inline-block; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; min-height: 16px; }
.np-seek { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.tm { font-size: 12px; color: var(--fg3); font-variant-numeric: tabular-nums; min-width: 42px; }
.tm:last-child { text-align: right; }
.np-ctrls { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0; }
.np-ctrls .ib:not(.big) .ic { width: 28px; height: 28px; }
.np-vol { display: flex; align-items: center; gap: 8px; max-width: 360px; margin: 0 auto; width: 100%; }
.np-next { text-align: center; color: var(--fg3); font-size: 13px; margin-top: 8px; }
.np-empty { text-align: center; padding: 12vh 20px; color: var(--fg2); }

input[type="range"] { -webkit-appearance: none; appearance: none; height: 22px; background: transparent; flex: 1; min-width: 60px; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); margin-top: -5px; }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--fg); }
input[type="range"]:disabled { opacity: .4; }

/* Bottom bar */
#bar { grid-area: bar; position: relative; border-top: 1px solid var(--line); background: var(--bg2); }
.bar-prog { position: absolute; left: 0; right: 0; top: -2px; height: 4px; cursor: pointer; }
.bar-prog:hover { height: 8px; top: -4px; }
.bar-prog-fill { height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }
.bar-main { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 14px; }
.bar-np { display: flex; align-items: center; gap: 12px; min-width: 0; text-align: left; }
.bar-art .art { width: 52px; height: 52px; }
.bar-np .meta { min-width: 0; }
.bar-np .t1 { font-weight: 600; }
.bar-ctrls { display: flex; align-items: center; gap: 6px; }
.bar-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
.bar-time { color: var(--fg3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-np .t2 .by:not(:empty) + .from:not(:empty)::before { content: " · "; }
.bar-pos { display: none; }
.bar-vol { display: flex; align-items: center; gap: 6px; width: 150px; color: var(--fg2); }
.bar-vol .ib { width: 32px; height: 32px; }
.bar-vol .ic { width: 18px; height: 18px; }

/* Sheet (menus and dialogs) */
#sheet { position: fixed; inset: 0; z-index: 50; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); opacity: 0; transition: opacity .15s; }
.sheet-panel { position: absolute; left: 50%; top: 50%; width: min(440px, calc(100vw - 24px)); max-height: min(80vh, 640px); display: flex; flex-direction: column;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); transform: translate(-50%, -46%); opacity: 0; transition: transform .15s, opacity .15s; }
#sheet.open .sheet-scrim { opacity: 1; }
#sheet.open .sheet-panel { opacity: 1; transform: translate(-50%, -50%); }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 10px 10px 16px; border-bottom: 1px solid var(--line); }
.sheet-title { flex: 1; min-width: 0; }
.sheet-title .t1 { font-weight: 700; font-size: 16px; }
.sheet-title .t2 { white-space: normal; }
.sheet-list { overflow-y: auto; padding: 6px; }
.sheet-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 12px; border-radius: 10px; text-align: left; }
.sheet-item:hover { background: var(--bg3); }
.sheet-item span { flex: 1; }
.sheet-item.checked { color: var(--accent); }
.sheet-item.danger { color: var(--danger); }
.sheet-item .tick { color: var(--accent); }
.sheet-sep { height: 1px; background: var(--line); margin: 6px 8px; }
.prompt { display: flex; flex-direction: column; gap: 12px; padding: 8px; }
.prompt .row-btns { justify-content: flex-end; margin: 0; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.day { display: inline-flex; align-items: center; gap: 4px; background: var(--bg3); padding: 6px 10px; border-radius: 999px; font-size: 13px; }
.lbl { display: flex; align-items: center; gap: 12px; color: var(--fg2); }

/* Players, tiles, settings */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.pcard { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard.sel { border-color: var(--accent); }
.pcard-head { display: flex; align-items: center; gap: 12px; }
.pcard-head .meta { flex: 1; min-width: 0; }
.pcard-head .t1 { font-weight: 700; }
.pcard-now { color: var(--fg2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard-ctrls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pcard-ctrls .vol { min-width: 90px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; aspect-ratio: 1.4; border-radius: var(--radius); background: var(--bg2); border: 1px solid var(--line); font-weight: 700; }
.tile:hover { border-color: var(--accent); color: var(--accent); }
.tile .ic { width: 34px; height: 34px; }
.tile.ghost { color: var(--fg2); }
.settings section { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 16px 14px; margin-bottom: 16px; max-width: 860px; }
.settings h3 { font-size: 15px; margin: 12px 0 8px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting > span { color: var(--fg); flex: 1; min-width: 0; }
.setting select { max-width: 55%; min-width: 0; text-overflow: ellipsis; }
.setting .vol { max-width: 220px; }
.swatches { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.swatch { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); flex: none; cursor: pointer; }
.swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.swatch.custom { background: conic-gradient(#f55, #fd5, #5d5, #5dd, #55f, #d5d, #f55); overflow: hidden; }
.swatch.custom:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch-pick { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.kv-row { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv-row .k { color: var(--fg3); }
.kv-row .v { display: flex; align-items: center; gap: 10px; justify-content: space-between; overflow-wrap: anywhere; }
.kv-row .v > span:empty { display: none; }   /* a row whose value is only a link or a button */
.kv-row .v a { color: var(--accent); }
.switch { -webkit-appearance: none; appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); background: var(--on-accent); }

/* Discovery screen */
.discover { max-width: 520px; margin: 8vh auto; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.discover h1 { margin: 0; font-size: 34px; }
.discover .logo .logo-img { width: 96px; height: 96px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
.discover .list { text-align: left; }
body:not(.ready) #nav, body:not(.ready) #bar, body:not(.ready) #playerBtn { visibility: hidden; }

/* Banners */
#unlock { position: fixed; left: 50%; bottom: calc(var(--bar) + 16px); transform: translateX(-50%); z-index: 40; background: var(--accent); color: var(--on-accent); padding: 12px 20px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); }
#conn { position: fixed; top: calc(var(--top) + 8px); left: 50%; transform: translateX(-50%); z-index: 40; background: var(--danger); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; max-width: 90vw; }
#update { position: fixed; top: calc(var(--top) + 8px); left: 50%; transform: translateX(-50%); z-index: 40; background: var(--accent); color: var(--on-accent); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; max-width: 90vw; box-shadow: var(--shadow); }
/* An LMS skin over the page (skin.js): the frame, and on LyrionJS's own pages the way back to it */
:root[data-host] #skinframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 35; background: var(--bg); }
:root[data-host].host-own #skinframe { display: none; }
:root[data-host] #skinBtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--bg3); color: var(--fg); font-weight: 600; font-size: 13px; white-space: nowrap; }
:root[data-host] #skinBtn:hover { background: var(--accent); color: var(--on-accent); }
#skinBtn { display: none; }
#skinBtn .ic { width: 18px; height: 18px; }
@media (max-width: 600px) { :root[data-host] #skinBtn span { display: none; } :root[data-host] #skinBtn { padding: 6px; } }
#toast { position: fixed; left: 50%; bottom: calc(var(--bar) + 16px); transform: translate(-50%, 20px); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: var(--danger); color: #fff; }

/* What only a skin shows (skins/): the top bar's volume, the queue beside the page, the search button, Home */
#topVol, #sideBtn, #fab, #side, .np-close, .nav-item[data-view="home"] { display: none; }
.home { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.home-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; aspect-ratio: 1.2; border-radius: var(--radius); background: var(--bg2); border: 1px solid var(--line); font-weight: 600; padding: 8px; text-align: center; }
.home-item:hover { border-color: var(--accent); color: var(--accent); }
.home-item .ic, .home-img { width: 40px; height: 40px; }
.home-img { border-radius: 8px; object-fit: cover; }

/* Small screens */
@media (max-width: 860px) {
  :root { --bar: 70px; }
  body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main" "bar"; }
  #serverName { display: none; }
  .np-quality { white-space: normal; }
  #menuBtn { display: inline-grid; }
  #nav { position: fixed; top: var(--top); bottom: 0; left: 0; width: 270px; z-index: 30; transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open #nav { transform: none; }
  body.nav-open #scrim { display: block; position: fixed; inset: var(--top) 0 0 0; z-index: 25; background: rgba(0, 0, 0, .4); }
  #view { padding: 0 14px 30px; }
  .badge { display: none; }
  .np { grid-template-columns: 1fr; gap: 18px; }
  .np-art { max-width: 420px; margin: 0 auto; }
  .np-title { font-size: 24px; text-align: center; }
  .np-sub, .np-station, .np-quality { text-align: center; align-items: center; }
  .hero { flex-direction: column; align-items: flex-start; }
  .hero-art { width: 160px !important; height: 160px; }
  .hero-meta h2 { font-size: 24px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px 10px; }
  .row-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); grid-auto-rows: 80px; overflow-x: visible; }
  .row-actions .btn { height: auto; aspect-ratio: auto; }
  .bar-main { grid-template-columns: minmax(0, 1fr) auto; }
  .bar-right .bar-vol, .bar-right .bar-when { display: none; }
  .bar-ctrls .ib:not(.mid) { display: none; }
  .bar-right { display: none; }
  .kv-row { grid-template-columns: 1fr; gap: 2px; }
  .sheet-panel { top: auto; bottom: 0; left: 0; width: 100%; transform: translateY(20px); border-radius: 18px 18px 0 0; max-height: 85vh; }
  #sheet.open .sheet-panel { transform: none; }
}
.nav-item .nav-img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }

/* About, and the page found inside itself */
.about-page { max-width: 640px; margin: 24px auto 40px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.about-title { margin: 8px 0 0; font-size: 26px; }
.about-lead { margin: 0; color: var(--fg2); line-height: 1.5; max-width: 52ch; }
.about-quip { margin: 0; min-height: 1.5em; font-weight: 700; color: var(--accent); }
.about-facts { width: 100%; text-align: left; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 16px 10px; }
.about-facts h3 { font-size: 15px; margin: 12px 0 6px; }
.about-btns { justify-content: center; margin-top: 6px; }
.about-more { margin-top: 10px; }
.mirror { width: min(220px, 60vw); aspect-ratio: 1; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 28%; }
.mirror-frame { position: relative; width: 100%; height: 100%; }
.mirror-frame .mirror-logo { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 4px 14px rgba(0,0,0,.35)); }
/* Each copy sits inside the one before, a little smaller and a little turned: forever, nearly. */
.mirror-frame > .mirror-frame { position: absolute; left: 21%; top: 21%; width: 58%; height: 58%; animation: lj-mirror 9s ease-in-out infinite alternate; }
@keyframes lj-mirror { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.mirror.wobble { animation: lj-wobble .45s ease; }
@keyframes lj-wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg) scale(.96); } 75% { transform: rotate(6deg) scale(1.03); } }
@media (prefers-reduced-motion: reduce) { .mirror-frame > .mirror-frame, .mirror.wobble { animation: none; } }


/* ---------------------------------------------------------------------------
   Material: laid out and coloured like LMS's Material Skin (its defaults: dark, the colour taken
   from the cover, tinted). Every rule here is for :root[data-skin="material"] only (skin.js sets
   it); the page's own look is style.css. The tinted --bg, --toolbar and --menu come from
   theme.js, which mixes them from the highlight colour.
   --------------------------------------------------------------------------- */
/* Roboto from Material Skin itself, where LMS has it (otherwise the system's) */
@font-face { font-family: "LJ Roboto"; font-weight: 400; src: local("Roboto"), local("Roboto-Regular"), url("/material/html/font/Roboto-Regular.ttf") format("truetype"); }
@font-face { font-family: "LJ Roboto"; font-weight: 500; src: local("Roboto Medium"), local("Roboto-Medium"), url("/material/html/font/Roboto-Medium.ttf") format("truetype"); }
@font-face { font-family: "LJ Roboto"; font-weight: 700; src: local("Roboto Bold"), local("Roboto-Bold"), url("/material/html/font/Roboto-Bold.ttf") format("truetype"); }
@font-face { font-family: "LJ Roboto Mono"; font-weight: 400; src: local("Roboto Mono"), local("RobotoMono-Regular"), url("/material/html/font/RobotoMono-Regular.ttf") format("truetype"); }

:root[data-skin="material"] {
  --fg: #edece7; --fg2: rgba(237, 236, 231, .7); --fg3: rgba(237, 236, 231, .5); --bg2: transparent; --bg3: rgba(255, 255, 255, .08);
  --line: rgba(237, 232, 232, .1); --hover: rgba(255, 255, 255, .04); --selected: rgba(255, 255, 255, .08); --np-veil: rgba(48, 48, 48, .8);
  --switch-off: #777; --knob-off: #333; --shadow: 0 1px 6px 1px rgba(0, 0, 0, .4); --scroll: #5f5f5f; --scroll-hover: #7f7f7f;
  --top: 48px; --bar: 72px; --side-w: clamp(320px, 30vw, 500px); --radius: 8px;
}
@media (prefers-color-scheme: light) {
  :root[data-skin="material"]:not([data-theme="dark"]) {
    --fg: #333; --fg2: rgba(51, 51, 51, .7); --fg3: rgba(51, 51, 51, .5); --bg3: rgba(0, 0, 0, .08);
    --line: rgba(51, 51, 51, .1); --hover: rgba(0, 0, 0, .04); --selected: rgba(0, 0, 0, .08); --np-veil: rgba(216, 216, 216, .8);
    --switch-off: #bbb; --knob-off: #fafafa; --shadow: 0 1px 6px 1px rgba(0, 0, 0, .12); --scroll: #8e9192; --scroll-hover: #6e7172;
  }
}
:root[data-skin="material"][data-theme="light"] {
  --fg: #333; --fg2: rgba(51, 51, 51, .7); --fg3: rgba(51, 51, 51, .5); --bg3: rgba(0, 0, 0, .08);
  --line: rgba(51, 51, 51, .1); --hover: rgba(0, 0, 0, .04); --selected: rgba(0, 0, 0, .08); --np-veil: rgba(216, 216, 216, .8);
  --switch-off: #bbb; --knob-off: #fafafa; --shadow: 0 1px 6px 1px rgba(0, 0, 0, .12); --scroll: #8e9192; --scroll-hover: #6e7172;
}
:root[data-skin="material"] body { font: 15px/1.5 "LJ Roboto", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
:root[data-skin="material"] * { scrollbar-color: var(--scroll) transparent; }
:root[data-skin="material"] ::-webkit-scrollbar { width: 10px; height: 10px; }
:root[data-skin="material"] ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 4px; border: 2px solid var(--bg); }
:root[data-skin="material"] ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }

/* Layout: no sidebar (the menu is a drawer, as Material's), the queue beside the page if asked for */
:root[data-skin="material"] body { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "top top" "main side" "bar bar"; }
:root[data-skin="material"] #menuBtn { display: inline-grid; }
:root[data-skin="material"] #nav { position: fixed; top: 0; bottom: 0; left: 0; width: min(400px, 85vw); z-index: 30; transform: translateX(-102%); transition: transform .2s;
  background: var(--menu); border-right: 0; border-radius: 0 12px 12px 0; box-shadow: var(--shadow); padding: 8px 0 24px; }
:root[data-skin="material"] body.nav-open #nav { transform: none; }
:root[data-skin="material"] body.nav-open #scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, .5); }
:root[data-skin="material"] .nav-item { border-radius: 0; padding: 12px 20px; gap: 24px; color: var(--fg); }
:root[data-skin="material"] .nav-item .ic { color: var(--fg2); }
:root[data-skin="material"] .nav-item:hover { background: var(--hover); }
:root[data-skin="material"] .nav-item.active { background: var(--selected); color: var(--fg); font-weight: 500; }
:root[data-skin="material"] .nav-item.active .ic { color: var(--accent); }
:root[data-skin="material"] .nav-item[data-view="home"] { display: flex; }
:root[data-skin="material"] .nav-sep { margin: 8px 0; }
:root[data-skin="material"] #side { display: flex; flex-direction: column; grid-area: side; width: var(--side-w); overflow-y: auto; border-left: 1px solid var(--line); padding: 0 0 24px; }
:root[data-skin="material"] #side .view-head { margin: 0 0 4px; padding: 0 4px 0 16px; }
:root[data-skin="material"] #side .view-head h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 400; }
:root[data-skin="material"] #side .view-sub { padding: 0 12px; font-size: 13px; }

/* Top bar: menu, the player's name, volume, the queue */
:root[data-skin="material"] #top { gap: 0; padding: 0 10px; background: var(--toolbar); border-bottom: 1px solid var(--line); }
:root[data-skin="material"] #top .ib { width: 36px; height: 36px; margin: 4px 6px; color: var(--fg); }
:root[data-skin="material"] .brand, :root[data-skin="material"] #serverName, :root[data-skin="material"] #localBadge { display: none; }
:root[data-skin="material"] #top .spacer { order: 2; }
:root[data-skin="material"] #playerBtn { order: 1; background: none; padding: 4px 8px; font-size: 15px; font-weight: 500; max-width: 50vw; border-radius: 4px; }
:root[data-skin="material"] #playerBtn:hover { background: var(--hover); }
:root[data-skin="material"] #playerBtn > .ic:first-child { display: none; }
:root[data-skin="material"] #topVol { order: 3; display: flex; align-items: center; width: 344px; }
:root[data-skin="material"] #topVol .vol { min-width: 0; }
:root[data-skin="material"] .top-pct { width: 44px; font-size: 15px; color: var(--fg); font-variant-numeric: tabular-nums; }
:root[data-skin="material"] #sideBtn { order: 4; display: inline-grid; }
:root[data-skin="material"] #sideBtn[aria-pressed="true"] { color: var(--accent); }

/* The page's title bar (Material's second toolbar) */
:root[data-skin="material"] #view { padding: 0 0 32px; }
:root[data-skin="material"] #view > :not(.view-head) { margin-left: 8px; margin-right: 8px; }
:root[data-skin="material"] .view-head { margin: 0 0 8px; padding: 2px 7px 0 16px; min-height: 48px; background: var(--bg); border-bottom: 1px solid var(--line); }
:root[data-skin="material"] .view-head h1 { font-size: 15px; font-weight: 400; }
:root[data-skin="material"] .view-head > .ib:first-child { margin-left: -10px; }
:root[data-skin="material"] .view-head .ib { width: 36px; height: 36px; color: var(--fg); }
:root[data-skin="material"] h3.section { font-size: 13px; font-weight: 500; letter-spacing: .04em; color: var(--accent); }

/* Search: Material's rounded-square button, low on the right */
:root[data-skin="material"] #fab { display: grid; place-items: center; position: fixed; right: 14px; bottom: calc(var(--bar) + 14px); z-index: 20; width: 48px; height: 48px; border-radius: 10px; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); }
:root[data-skin="material"] #fab:hover { filter: saturate(150%); }
:root[data-skin="material"] body:not(.ready) #fab, :root[data-skin="material"] body[data-view="now"] #fab,
:root[data-skin="material"] body[data-view="search"] #fab, :root[data-skin="material"] body[data-view="settings"] #fab { display: none; }

/* Buttons, rows, cards, menus: Vuetify's */
:root[data-skin="material"] .ib { color: var(--fg); }
:root[data-skin="material"] .ib:hover { background: var(--hover); }
:root[data-skin="material"] .btn { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; padding: 7px 16px; }
:root[data-skin="material"] .btn:hover { background: var(--hover); }
:root[data-skin="material"] .btn.ghost { border-color: transparent; color: var(--accent); background: transparent; }
:root[data-skin="material"] .btn.ghost:hover { background: var(--hover); }
:root[data-skin="material"] .list { margin: 0 -8px; }
:root[data-skin="material"] .row { border-radius: 0; min-height: 48px; gap: 10px; padding: 1px 12px 1px 10px; border-bottom: 1px solid var(--line); }
:root[data-skin="material"] .row[role="button"]:hover { background: var(--hover); }
:root[data-skin="material"] .row[aria-expanded="true"] { background: var(--hover); border-radius: 0; border-bottom: 0; }
:root[data-skin="material"] .row-actions { background: var(--hover); border-radius: 0; padding: 2px 12px 8px 10px; border-bottom: 1px solid var(--line); }
:root[data-skin="material"] .row-actions .btn { border-color: var(--line); border-radius: 8px; padding: 6px; }
:root[data-skin="material"] .row.current { background: rgba(var(--accent-rgb), .25); }
:root[data-skin="material"] .row.current .t1 { color: var(--fg); font-weight: 400; }
:root[data-skin="material"] .t2 { color: var(--fg2); font-size: 13px; margin-top: -2px; }
:root[data-skin="material"] .row .art.sm { width: 45px; height: 45px; border-radius: 4px; }
:root[data-skin="material"] .grid { grid-template-columns: repeat(auto-fill, minmax(139px, 1fr)); gap: 4px; }
:root[data-skin="material"] .card { border-radius: 9px; padding: 3px 3px 8px; text-align: center; }
:root[data-skin="material"] .card:hover { background: var(--hover); }
:root[data-skin="material"] .card .art { border-radius: 9px; }

<script id="lj-worklet">
/* LyrionJS output stage. Plays queued PCM chunks in order and reports what it has rendered,
 * so the main thread can tell LMS exactly what is being heard. The same class runs inside an
 * AudioWorklet (HTTPS / localhost pages) or on the main thread under a ScriptProcessorNode
 * (plain http pages, where browsers don't offer AudioWorklet).
 * Messages in:  push {id, seq, l, r}, flush {epoch}, trim {keep}, play, pause,
 *               startAt {frame}, pauseFor {frames}, skip {frames}, gain {g, now}
 * Messages out (all carry the epoch of the last flush):
 *   seg {seq, frame}   the first sample of a track was rendered at this context frame
 *   pos {frame, seq, pos, queued, playing, under, lastId, event}  state after a quantum */
class LyrionOutputCore {
  /** port: {postMessage, onmessage}; clock(): the context frame of the next sample rendered. */
  constructor(port, clock) {
    this.port = port; this.clock = clock;
    this.q = []; this.qi = 0; this.queued = 0; this.lastId = 0; this.epoch = 0;
    this.playing = false; this.startAt = -1; this.silence = 0;
    this.g = 1; this.gt = 1; this.seq = null; this.pos = 0; this.under = false; this.n = 0;
    port.onmessage = (e) => this.msg(e.data);
  }
  msg(m) {
    switch (m.t) {
      case 'push': this.q.push(m); this.queued += m.l.length; this.lastId = m.id; break;
      case 'flush':
        this.q = []; this.qi = 0; this.queued = 0; this.seq = null; this.pos = 0;
        this.startAt = -1; this.silence = 0; this.playing = false; this.under = false; this.epoch = m.epoch;
        this.report(this.clock(), true); break;
      case 'trim': {
        const head = this.q[0];
        this.q = this.q.filter((c) => c.seq <= m.keep);
        if (this.q[0] !== head) this.qi = 0;
        this.queued = this.q.reduce((a, c, i) => a + c.l.length - (i === 0 ? this.qi : 0), 0);
        this.report(this.clock(), true); break;
      }
      case 'play': this.playing = true; this.startAt = -1; this.report(this.clock(), true); break;
      case 'pause': this.playing = false; this.report(this.clock(), true); break;
      case 'startAt': this.playing = true; this.startAt = m.frame; break;
      case 'pauseFor': this.silence += Math.max(0, m.frames | 0); break;
      case 'skip': {
        let n = m.frames | 0;
        while (n > 0 && this.q.length) {
          const c = this.q[0], k = Math.min(n, c.l.length - this.qi);
          if (c.seq !== this.seq) { this.seq = c.seq; this.pos = 0; this.port.postMessage({ t: 'seg', seq: c.seq, frame: this.clock(), epoch: this.epoch }); }
          this.qi += k; this.pos += k; this.queued -= k; n -= k;
          if (this.qi >= c.l.length) { this.q.shift(); this.qi = 0; }
        }
        this.report(this.clock(), true); break;
      }
      case 'gain': this.gt = m.g; if (m.now) this.g = m.g; break;
    }
  }
  report(frame, event) {
    this.port.postMessage({
      t: 'pos', frame, seq: this.seq, pos: this.pos, queued: this.queued, lastId: this.lastId,
      playing: this.playing && this.startAt < 0, under: this.under, epoch: this.epoch, event: !!event,
    });
  }
  process(_inputs, outputs) {
    const out = outputs[0], L = out[0], R = out[1] || null, n = L.length, base = this.clock();
    let event = false;
    for (let i = 0; i < n; i++) {
      let l = 0, r = 0;
      if (this.playing && (this.startAt < 0 || base + i >= this.startAt)) {
        if (this.startAt >= 0) { this.startAt = -1; event = true; }
        if (this.silence > 0) {
          this.silence--;
        } else {
          while (this.q.length && this.qi >= this.q[0].l.length) { this.q.shift(); this.qi = 0; }
          if (this.q.length) {
            const c = this.q[0];
            if (c.seq !== this.seq) {
              this.seq = c.seq; this.pos = 0; event = true;
              this.port.postMessage({ t: 'seg', seq: c.seq, frame: base + i, epoch: this.epoch });
            }
            l = c.l[this.qi]; r = c.r ? c.r[this.qi] : l;
            this.qi++; this.pos++; this.queued--;
            if (this.under) { this.under = false; event = true; }
          } else if (!this.under) { this.under = true; event = true; }
        }
      }
      // ~10 ms exponential ramp (at 48 kHz) so volume changes never click.
      this.g += (this.gt - this.g) * 0.002;
      L[i] = l * this.g; if (R) R[i] = r * this.g;
    }
    // Report every ~1000 frames: 8 worklet quanta, or every main-thread buffer.
    this.n += n;
    if (event || this.n >= 1024) { this.n = 0; this.report(base + n, event); }
    return true;
  }
}

if (typeof AudioWorkletProcessor === 'function' && typeof registerProcessor === 'function') {
  registerProcessor('lyrionjs-output', class extends AudioWorkletProcessor {
    constructor() { super(); this.core = new LyrionOutputCore(this.port, () => currentFrame); }
    process(inputs, outputs) { return this.core.process(inputs, outputs); }
  });
} else {
  (globalThis.LJ || (globalThis.LJ = {})).LyrionOutputCore = LyrionOutputCore;
}
</script>

    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on')) { if (typeof v === 'function') el.addEventListener(k.slice(2), v); }   // never an inline handler
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));

    if (!best || best.n < seen * 0.02) return null;   // hardly any colour
    return rgbHex([best.r / best.n, best.g / best.n, best.b / best.n]);
  }

  let coverHex = null, coverFor;
  const accentChoice = () => store.get('accent', skin() === 'material' ? 'cover' : 'orange');
  /** The cover now shown changed: take its colour, where the highlight comes from the cover. */
  function coverAccent(url) {
    if (url === coverFor) return;
    coverFor = url;
    const done = (hex) => { if (coverFor !== url) return; const was = coverHex; coverHex = hex; if (accentChoice() === 'cover' && was !== hex) applyTheme(); };
    if (!url) return done(null);
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 48;
        const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, 48, 48);
        done(dominantColour(g.getImageData(0, 0, 48, 48).data));
      } catch (e) { done(null); }
    };
    img.onerror = () => done(null);
    img.src = url;
  }

  function applyTheme() {
    const t = store.get('theme', 'auto');
    if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
    // The same selectors as the style sheet's, later in the page: these win.
    const { dark, light } = accentShades(accentChoice(), coverHex);
    const rgb = (a) => hexRgb(a.length === 4 ? '#' + [...a.slice(1)].map((x) => x + x).join('') : a);
    const vars = ([a, a2, on]) => `--accent: ${a}; --accent2: ${a2}; --on-accent: ${on}; --accent-rgb: ${rgb(a).join(', ')};`;
    // Material tints the page with its colour (the deeper shade), more in the toolbars.
    const tint = (base, t) => rgbHex(mix(hexRgb(base), rgb(light[0]), t));
    const md = `--bg: ${tint('#212121', 0.15)}; --toolbar: ${tint('#212121', 0.25)}; --menu: ${tint('#303030', 0.15)};`;
    const ml = `--bg: ${tint('#fafafa', 0.25)}; --toolbar: ${tint('#fafafa', 0.35)}; --menu: ${tint('#fafafa', 0.15)};`;
    const M = '[data-skin="material"]';
    let el = document.getElementById('lj-theme');
    if (!el) { el = document.createElement('style'); el.id = 'lj-theme'; document.head.append(el); }
    el.textContent = `:root { ${vars(dark)} } :root${M} { ${md} }\n`
      + `@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { ${vars(light)} } :root${M}:not([data-theme="dark"]) { ${ml} } }\n`
      + `:root[data-theme="light"] { ${vars(light)} } :root${M}[data-theme="light"] { ${ml} }`;
  }
  // ---------------------------------------------------------------------------
  // LMS JSON-RPC, same-origin (the page is served by LMS, or by the dev relay that proxies it)
  // ---------------------------------------------------------------------------
  /** Does this address name an SVG picture (by its path)? */
  const isSvg = (u) => /^[^?#]*\.svg(?:[?#]|$)/i.test(u);

  class LMS {
    constructor() { this.base = '/'; }
    async rpc(player, cmd, timeout = 20000) {
      const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), timeout);
      try {
        const r = await fetch(this.base + 'jsonrpc.js', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
          body: JSON.stringify({ id: 1, method: 'slim.request', params: [player || '', cmd.map((x) => String(x))] }),
        });
        if (!r.ok) throw new Error(tr('LMS answered {status}', { status: r.status }));
        const j = await r.json();
        return j.result || {};
      } catch (e) {
        if (e.name === 'AbortError') throw new Error(tr('LMS did not answer in time'));
        throw e;
      } finally { clearTimeout(tm); }
    }
    url(path) { return this.base + String(path).replace(/^\//, ''); }
    art(src, size = 300) {
      if (!src) return null;
      src = String(src);
      if (/^\/\//.test(src)) src = 'http:' + src;   // protocol-relative: another host
      // Images from other hosts go through LMS's image proxy: the page never loads them itself.
      // SVGs, which the proxy can't resize and so sends off-site, go through the plugin instead.
      if (/^https?:\/\//i.test(src)) {
        return isSvg(src) ? this.base + 'plugins/LyrionJS/svg?u=' + encodeURIComponent(src)
          : this.base + 'imageproxy/' + encodeURIComponent(src) + `/image_${size}x${size}_f.png`;
      }
      if (/^[a-z][a-z0-9+.-]*:/i.test(src)) return null;   // data:, javascript: and the like
      src = src.replace(/^[\\/\s]+/, '');   // a path on this server, however it starts
      if (/^music\/[^/]+\/cover$/.test(src)) src += `_${size}x${size}_f`;
      // An SVG LMS has already put through its image proxy: through the plugin instead.
      const via = src.match(/^imageproxy\/([^/]+)\//);
      if (via) {
        let u = '';
        try { u = decodeURIComponent(via[1]); } catch (e) { /* not an address */ }
        if (/^https?:\/\//i.test(u) && isSvg(u)) return this.art(u, size);
      }
      // LMS's image proxy sends a picture itself only when asked for a size: at full size (as LMS
      // hands them out, ".../image.png") it redirects to the picture's own host, which this page
      // doesn't load from. So radio logos and the like are always asked for at a size.
      const px = src.match(/^(imageproxy\/[^/]+\/image)(\.(?:png|jpe?g|gif))?$/i);
      if (px) src = px[1] + `_${size}x${size}_f` + (/^\.jpe?g$/i.test(px[2] || '') ? '.jpg' : '.png');
      try { if (new URL(this.base + src, location.href).origin !== location.origin) return null; } catch (e) { return null; }
      return this.base + src;
    }
    cover(id, size = 300) { return id == null || id === '' ? null : this.base + `music/${encodeURIComponent(id)}/cover_${size}x${size}_f`; }
  }
  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  const S = {
    server: null, lms: null, players: [], target: store.get('target', null), status: null, statusAt: 0,
    local: null, localId: null, output: null, outputMode: '', nav: [], syncgroups: [], localStatus: null,
    serverInfo: null, polling: false, lastPlaylistTs: null, lastPlaylistCur: null, ownsPlayer: false,

  // This browser's player's MAC, made once. The plugin keeps a copy in a cookie (config.json, in
  // boot.js): Safari deletes a page's storage after 7 days without a visit but not a cookie the
  // server set, so a browser stays the same player rather than coming back as a new one.
  const MAC_RE = /^02:4c:4a(:[0-9a-f]{2}){3}$/;
  function macBytes() {
    let mac = store.get('mac', null);
    if (!MAC_RE.test(mac || '')) {
      const m = /(?:^|;\s*)lj_mac=([^;]*)/.exec(document.cookie);
      if (m && MAC_RE.test(m[1])) { mac = m[1]; store.set('mac', mac); }
    }
    if (!MAC_RE.test(mac || '')) {
      const r = crypto.getRandomValues(new Uint8Array(3));
      mac = ['02', '4c', '4a', ...[...r].map((b) => b.toString(16).padStart(2, '0'))].join(':');
      store.set('mac', mac);
    }
    return { str: mac, bytes: new Uint8Array(mac.split(':').map((x) => parseInt(x, 16))) };
  }

  /** iPhone, iPad or iPod (iPadOS Safari claims to be a Mac; touch support gives it away). */
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

  function defaultName() {
    const ua = navigator.userAgent;
    const b = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
    // iPadOS Safari claims to be a Mac; touch support gives it away.
    const ipad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const os = /Android/.test(ua) ? 'Android' : ipad ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Mac OS X/.test(ua) ? 'macOS' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : '';
    return os ? tr('LyrionJS {browser} on {os}', { browser: b, os }) : 'LyrionJS ' + b;
  }

  const rpc = (cmd, player = S.target) => S.lms.rpc(player, cmd);

  // ---------------------------------------------------------------------------

  // -- the sheet --------------------------------------------------------------

  // -- lists ------------------------------------------------------------------
  /**
   * A lazily loaded list or grid. fetch(start, count) -> {items, total, consumed?}: `consumed`
   * is how many entries of the collection the page covered, when items were filtered out of it.
   * Loading stops as soon as the list leaves the page.
   */
  function lazyList({ fetch, render, grid = false, empty = tr('Nothing here.'), page = 100 }) {
    const box = h('div', { class: grid ? 'grid' : 'list' });
    const sentinel = h('div', { class: 'sentinel' });
    const wrap = h('div', { class: 'lazy' }, box, sentinel);
    let start = 0, total = Infinity, loading = false, idx = 0, shown = 0, gen = 0;
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) more(); }, { rootMargin: '600px' });
    async function more() {
      if (loading || start >= total) return;
      if (!wrap.isConnected && start > 0) return;   // gone from the page (or not shown): stop
      const my = gen;
      loading = true; sentinel.classList.add('busy');
      try {
        const r = await fetch(start, page);
        if (my !== gen) return;                       // reloaded meanwhile: this page is stale
        const covered = r.consumed != null ? r.consumed : r.items.length;
        total = r.total == null ? (covered < page ? start + covered : Infinity) : r.total;
        for (const it of r.items) { const el = render(it, idx++); if (el) { box.append(el); shown++; } }
        start += covered;
        if (!covered) total = start;
        if (start >= total && !shown) box.append(h('div', { class: 'empty', text: empty }));
      } catch (e) { if (my === gen) { fail(e); total = start; } }
      finally { if (my === gen) { loading = false; sentinel.classList.remove('busy'); } }
      if (my === gen && start < total && wrap.isConnected && sentinel.getBoundingClientRect().top < window.innerHeight + 600) more();
    }
    io.observe(sentinel);
    wrap.reload = () => { gen++; loading = false; box.textContent = ''; start = 0; total = Infinity; idx = 0; shown = 0; more(); };
    wrap.dispose = () => { gen++; io.disconnect(); };
    more();
    return wrap;
  }

  /** Stops the lazy lists in el (el itself may be one). */
  function disposeLists(el) {

  }

  /** Replace what a holder shows; lists it showed stop loading. */

  /** fetch() for lazyList over an LMS query: cmd(start, count) -> result; key: the loop's name. */
  const loopFetch = (cmd, key, keep) => async (s, n) => {
    const r = await cmd(s, n);
    const raw = r[key] || [];
    return { items: keep ? raw.filter(keep) : raw, total: +r.count || 0, consumed: raw.length };
  };

  function row({ art, artIcon = 'note', title, sub, right, onclick, menu, cls = '', num, draggable }) {

  const VIEWS = {};

    ['artists', N_('Artists'), 'artist'], ['albums', N_('Albums'), 'album'], ['genres', N_('Genres'), 'genre'], ['years', N_('Years'), 'year'],
    ['newmusic', N_('New music'), 'star'], ['randomalbums', N_('Random albums'), 'shuffle'], ['folders', N_('Music folder'), 'folder'], ['playlists', N_('Playlists'), 'playlist'], 'plugins',
    ['favourites', N_('Favourites'), 'fav'], ['radio', N_('Radio'), 'radio'], ['apps', N_('Apps'), 'apps'], ['random', N_('Random mix'), 'random'], null,
    ['players', N_('Players'), 'speaker'], ['alarms', N_('Alarms'), 'alarm'], ['settings', N_('Settings'), 'settings'],

  const navKey = (e) => (e.params && e.params.navId) || e.name;
  function markNav(name) { for (const b of document.querySelectorAll('.nav-item')) b.classList.toggle('active', b.dataset.view === name); }

    try {
      const make = VIEWS[entry.name] || VIEWS.now;

    } catch (e) {
      console.error(e);

    }

  function show(entry) {
    const main = document.getElementById('view');
    const cur = S.shown;
    if (cur && cur !== entry && cur.page && cur.page.onHide) cur.page.onHide();
    main.textContent = '';

  /** The tab's name for a page: its title and LyrionJS's (once, if the title already has it). */
  const tabTitle = (t) => (!t ? 'LyrionJS' : /LyrionJS/.test(t) ? t : t + ' · LyrionJS');
  /** A page may learn its title after it is shown (LMS menus). */
  function setTitle(page, t) { page.title = t; if (page.head) page.head.textContent = t; if (S.shown && S.shown.page === page) document.title = tabTitle(t); }

  function dispose(entry) {
    const p = entry.page;
    if (!p) return;
    if (p.onHide && S.shown === entry) p.onHide();

  /** A history entry's state: how deep, and whether it's LyrionJS's own pages over an LMS skin. */
  const navState = (d) => (document.documentElement.classList.contains('host-own') ? { d, own: 1 } : { d });
  function saveScroll() { const top = S.nav[S.nav.length - 1]; if (top) top.scroll = document.getElementById('view').scrollTop; }
  function push(name, params) {
